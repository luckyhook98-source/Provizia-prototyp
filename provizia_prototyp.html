/* ===================== CRM VOLANIE (v0.4.1 — viacťahový rozhovor) ===================== */
/* ---------- OTVORENIE HOVORU ----------
   Každý hovor začína tým, že sa predstavíš. Až podľa toho, ako to urobíš,
   sa odvíja, či človek nasadí odmietavý tón, alebo ťa nechá hovoriť. */
const ZDVIHNUTIA=["„Áno, prosím?“","„Haló?“","„Prosím?“","„Áno?“","„Haló, kto je tam?“",
 "„Počúvam.“","„Áno, čo je?“","Zdvihla, ale nič nepovedala. Počuť len dýchanie."];
const OTVORENIA=[
 {t:"„Dobrý deň, {MENO} {PRIEZ}, volám z finančnej spoločnosti. Dôvod môjho hovoru je jednoduchý…“",
  v:4, tech:"ram"},
 {t:"„Dobrý deň, {OSL} {P}. Volám kvôli dotazníku, ktorý ste kedysi vypĺňali.“",
  v:3, tech:"ram"},
 {t:"„Dobrý deň, tu {MENO} {PRIEZ}. Viem, že volám z čista jasna — dáte mi tridsať sekúnd a potom sa rozhodnete?“",
  v:4, tech:"priamost"},
 {t:"„Dobrý deň, {OSL} {P}. Nevolám nič predávať. Volám zistiť, či to u vás vôbec má zmysel.“",
  v:4, tech:"ram"},
 {t:"„Dobrý deň, nevyrušujem? Máte chvíľku?“", v:-2, tech:"tlak"},
 {t:"„Dobrý deň, volám z finančnej spoločnosti. Máte záujem o naše produkty?“", v:-2, tech:"tlak"},
 {t:"„Dobrý deň, robíme prieskum o výdavkoch domácností, zaberie to dve minúty.“", v:1, tech:"priamost"},
 {t:"„Dobrý deň! A ako sa dnes máte?“", v:0, tech:"oznacenie"}
];
/* rebríček nálad — dobré predstavenie posunie človeka o stupienok hore, zlé dole */
const REBRICEK=["brutal_neg","neg","neutral","poz"];
function posunNalady(id,o){
 const idx=REBRICEK.indexOf(id);
 if(idx<0)return id;                       /* brutálne pozitívny sa neposúva, to je dar */
 let hore=Math.max(0,Math.min(.66,.03+o.v*.085+A("kom")*.025+A("dov")*.016));
 /* Kto zdvihol naštvaný, toho predstavením zachrániš len málokedy. */
 if(idx===0)hore*=.32;
 const dole=Math.max(0,Math.min(.6,.08-o.v*.11));
 const r=Math.random();
 if(r<hore&&idx<REBRICEK.length-1)return REBRICEK[idx+1];
 if(r>1-dole&&idx>0)return REBRICEK[idx-1];
 return id;
}
function otvoreniaHovoru(){
 const sg=segment(CRM?CRM.seg:"studene");
 const vlastne=(sg.uvody||[]).slice(0,3);
 const vseobecne=OTVORENIA.filter(o=>o.v<=1);      /* slabé a pasce ostávajú vždy */
 return vlastne.concat(vseobecne);
}
function crmOtvor(i){
 const c=CRM; if(!c||!c.cl)return;
 const zoz=otvoreniaHovoru(); const o=zoz[i]; if(!o)return;
 const k=c.cl;
 if(!c.roz)c.roz=novyRozhovor(k,c.nalada,isFinite(c.ochota)?c.ochota:.3);
 const vysl=pouziTechniku(c.roz,k,o);
 c.poslednyTah={tech:o.tech,...vysl};
 c.hist.push(`<span class="dim">${osl(k)} ${k.priez}:</span> ${c.zdvihnutie}`);
 c.hist.push(`<span class="green">Ty:</span> ${textOtvorenia(o,k)}`);
 /* až teraz sa ukáže, ako je na tom naladený */
 const novaNalada=posunNalady(c.nalada.id,o);
 if(novaNalada!==c.nalada.id){
  c.posunNalady=REBRICEK.indexOf(novaNalada)>REBRICEK.indexOf(c.nalada.id)?"lepsie":"horsie";
  c.nalada=NALADY.find(n=>n.id===novaNalada)||c.nalada;
  c.stat[c.nalada.id]=(c.stat[c.nalada.id]||0)+1;
 } else c.posunNalady=null;
 c.maxBeat=crmMaxBeat(k,c.nalada);
 if(c.nalada.id==="brutal_poz"){c.step=5;sCash();crmDraw();return}
 c.rep=crmUvod(c.nalada);
 c.poslednySignal=dajSignal(c.roz,k);
 c.step=1; sClick(); crmDraw();
}
const textOtvorenia=(o,k)=>o.t.replace("{MENO}",S.meno).replace("{PRIEZ}",S.priez)
 .replace("{OSL}",osl(k)).replace("{P}",k.priez);
/* Pred hodinou telefonovania si vyberáš, ktorú databázu ideš obvolávať. */
const STAVY_KL={lead:"nový kontakt",rozprac:"rozpracovaný",odmietol:"odmietol",
 teply:"teplý kontakt","stratený":"stratený",klient:"klient"};
const potrebujeServis=function(k){
 return k&&k.stav==="klient"&&(k.zmluvy||[]).length&&
   k.zmluvy.some(function(z){return !z.serviced})&&
   !S.kalendar.some(function(e){return e.kid===k.id&&!e.done});
};
/* Zoznam konkrétnych ľudí — z Volania, bez chodenia do Klientov. */
function crmZoznam(typ){
 const servis=(typ==="servis");
 const zoz=Object.values(S.klienti).filter(servis?potrebujeServis
   :function(k){return mozeZnovu(k)||k.stav==="teply"});
 let h=appBar(servis?"Servis klientov":"Ozvať sa znova",
   servis?"Návšteva u klienta, ktorý už podpísal. Znižuje riziko storna na polovicu."
     :"Ľudia, s ktorými si už hovoril. Po čase sa im dá ozvať znova.")+`<div class="panel">`;
 if(!zoz.length){
  h+=`<div class="karta mala"><span class="dim">${servis
   ?"Zatiaľ nemáš klienta, ktorý by potreboval servis."
   :"Zatiaľ tu nikto nie je. Kontakty sem pribudnú po odmietnutých stretnutiach."}</span></div>`;
 }
 zoz.slice(0,40).forEach(function(k){
  const pozn=(k.pozn||[]).slice(-1)[0]||"";
  if(servis){
   const nevhodne=k.zmluvy.filter(function(z){return !z.fit}).length;
   h+=`<button onclick="planServis(${k.id})">🔧 <b>${celeMeno(k)}</b>
     <span class="dim">· ${k.mesto}</span>
     <span class="dim mala"><br>${k.zmluvy.length} ${k.zmluvy.length===1?"zmluva":"zmluvy"}${
     nevhodne?` · <span class="red">${nevhodne} riziková</span>`:""} — naplánovať návštevu</span></button>`;
  } else {
   const moze=(S.faza===0&&S.energia>=1);
   h+=`<button ${moze?"":"disabled"} onclick="znovuVolat(${k.id})">📞 <b>${celeMeno(k)}</b>
     <span class="dim">· ${k.mesto} · ${STAVY_KL[k.stav]||k.stav}</span>
     <span class="dim mala"><br>${moze?(pozn||"1 energia · možno sa niečo zmenilo")
       :"volať sa dá len ráno a s energiou"}</span></button>`;
  }
 });
 if(zoz.length>40)h+=`<div class="karta mala"><span class="dim">Zobrazených 40 z ${zoz.length}. Ostatných nájdeš v Klientoch.</span></div>`;
 h+=`</div>`;
 setBody(h);
}

/* ===================== STRETNUTIE ===================== */
/* klient z poškodenej alebo staršej uloženej pozície musí byť použiteľný */
function opravKlienta(k){
 if(!k)return k;
 if(!Array.isArray(k.obavy))k.obavy=[];
 if(!Array.isArray(k.znama))k.znama=[];
 if(!Array.isArray(k.pozn))k.pozn=[];
 if(!Array.isArray(k.zmluvy))k.zmluvy=[];
 if(!k.draw||typeof k.draw!=="object")k.draw={};
 if(!k.qvar||typeof k.qvar!=="object")k.qvar={};
 k.obavy=k.obavy.filter(o=>OBAVY[o]);
 if(!k.obavy.length)k.obavy=[OBAVY_K[0]];
 k.obavy.forEach(o=>{if(!Array.isArray(k.draw[o])||!k.draw[o].length)
  k.draw[o]=vyberOdpovede(o);
  });
 if(!PERSONY.find(x=>x.id===k.persona))k.persona=PERSONY[0].id;
 if(!NEEDS[k.need])k.need=Object.keys(NEEDS)[0];
 if(!isFinite(k.nar))k.nar=3;
 if(!isFinite(k.dov))k.dov=0;
 if(!isFinite(k.vek))k.vek=40;
 if(k.pohl!=="m"&&k.pohl!=="z")k.pohl="m";
 if(!k.meno)k.meno="Neznámy"; if(!k.priez)k.priez="Kontakt";
 if(!SEGMENTY.some(s=>s.id===k.seg))k.seg=SEG_VYCHODZI;
 if(!k.mesto)k.mesto="Nitra";
 return k;
}
/* zhoda štýlu odpovede s osobnosťou — dopĺňa technikovú citlivosť */
function stylBonus(k,s){
 const p=persona(k); let b=0;
 if(s===p.pref)b+=2; if(s===p.anti)b-=2;
 if(s==="fakt")b+=Math.floor(A("odb")/4);
 if(s==="empatia")b+=Math.floor(A("emp")/4);
 if(s==="priamost")b+=Math.floor(A("dov")/4);
 if(s==="rychlost"||s==="cena")b+=Math.floor(A("kom")/5);
 return b;
}

function dalsiaObava(){const k=KL(M.kid); if(!k)return; opravKlienta(k);

 M.roz.trp-=CENA_NAMIETKA; sClick();meetDraw()}

 const vysl=pouziTechniku(M.roz,k,{t:"otázka",v:2,tech:"otazka"},CENA_OTAZKA);
 M.poslednyTah={tech:"otazka",...vysl};
 const un=[0,1,2,3,4].filter(i=>!k.znama.includes(i));
 if(un.length){const n=A("emp")>=5&&un.length>1?2:1;
  for(let j=0;j<n&&un.length;j++)k.znama.push(un.splice(Math.floor(Math.random()*un.length),1)[0]);sGood()}
 else sClick();

function zhrnutie(){const k=KL(M.kid); if(!k)return;
 const vysl=pouziTechniku(M.roz,k,{t:"zhrnutie",v:2+Math.min(2,Math.floor(zistene(k)/2)),tech:"oznacenie"},CENA_ZHRNUTIE);

 }else if(stav==="vyriesena_slabo"){

     <span class="dim"> — voľné ${volnoDna(v.m,v.d)}/${KAPACITA}</span></button>`).join("")
    :`<p class="red mala">Máš plný kalendár.</p>`}
   <button onclick="odlozKlienta(${k.id})">Nechať to tak <span class="dim">— zostane v databáze</span></button></div>`;
  sClick(); return;
 }
 pridajStres(2);pridajPohodu(-2);
 k.stav="odmietol"; k.odmietnutyDna={m:S.mesiac,d:S.den};

function dokonciZmluvu(k,p,zost,odp,prepis,uzRozhodnute){
 const ch=sancaNaPodpis(M.roz,k,p,zost)*(S.lvl===1?1.12:1);
 const romanText=M.romanText;
 if(!uzRozhodnute&&Math.random()>=ch){
  k.pozn.push(`${odmietol(k)} ${p.nm}.`);
  /* ak už na tomto stretnutí niečo podpísal, odmietnutie ďalšej zmluvy
     nesmie zahodiť to, čo je hotové */
  if(M.podpisane.length){
   M.odmietnutyDopredaj++;
   M.roz.dovera=Math.max(0,M.roz.dovera-4);
   M.poslednyPodpis=null;
   M.odmietnutaVeta=`„Toto už nie. Nechajme to pri tom, čo sme dohodli.“`;
   M.faza="dopredaj"; sBad(); meetDraw(); return;
  }
  meetVysledok(k,"bezpodpisu");return}
 const fit=(p.need===k.need);
 const podiel=S.lvl===1?0.28:1, un=Math.max(1,Math.round(p.un*podiel));
 S.unMonth+=un;S.unTotal+=un;S.papiere++;checkLevel();
 if(!Array.isArray(S.papiereZoz))S.papiereZoz=[];
 S.papiereZoz.push(`${p.nm} — ${celeMeno(k)} (${S.mesiac}/${S.den})`);
 const eur=un*UN_RATE[S.lvl]*(1-TAX);
 const z={un,eur,fit,prod:p.nm,klient:celeMeno(k),kid:k.id,m:S.mesiac,serviced:false,cudzie:S.lvl===1};
 S.zmluvy.push(z);k.zmluvy.push(z);k.stav="klient";k.dov=Math.round(M.roz.dovera/3);
 if(M.ev)M.ev.vysl=fit?"podpis (vhodné)":"podpis";
 if(fit){pridajRep(3);logg(`${celeMeno(k)} ${podpisal(k)} ${p.nm}. Sedelo mu to. +${un} UN`,"green")}
 else{const t=2+Math.floor(Math.random()*5);
  S.storna.push({m:S.mesiac+t,un,eur,kid:k.id,prod:p.nm});
  k.pozn.push(`${p.nm}, hoci ${NEEDS[k.need]}.`);
  logg(`${celeMeno(k)} ${podpisal(k)} ${p.nm}. +${un} UN <span class="dim">(nepotreboval to)</span>`,"un-t")}
 if(prepis)k.pozn.push("Roman prepísal tvoje odporúčanie.");
 if(!fit&&k.seg==="prirodzeny"){
  pridajPohodu(-6); pridajRep(-2);

 }
 pridajStres(-3);pridajPohodu(4);
 z.prodId=p.id;
 M.podpisane.push(z);
 M.roz.trp-=12;
 M.romanText=null;
 sCash();
 M.faza="dopredaj"; M.poslednyPodpis={un,eur,prod:p.nm,fit,romanText};
 meetDraw();
}

function dopredaj(id){
 if(!M)return; const k=KL(M.kid); if(!k)return;
 const zoz=moznostiDopredaja(k,M.podpisane);
 const volba=zoz.find(z=>z.p.id===id); if(!volba)return;
 const poradie=M.podpisane.length+1;
 const s=sancaDopredaja(M.roz,k,volba,poradie);
 M.roz.trp-=14;
 if(!volba.viazany){M.roz.dovera=Math.max(0,M.roz.dovera-9);M.tlak++}
 if(Math.random()<s){ M.produkt=id;
  /* o výsledku je rozhodnuté tu — druhýkrát sa nehádže */
  if(S.lvl===1){romanUzatvara(k,volba.p,0,true);return}
  dokonciZmluvu(k,volba.p,0,volba.p,false,true);return}
 /* odmietol dopredaj — prvá zmluva ostáva */
 M.odmietnutyDopredaj++;
 M.roz.dovera=Math.max(0,M.roz.dovera-(volba.viazany?3:8));
 M.poslednyPodpis=null;
 M.odmietnutaVeta=volba.viazany
  ? rnd([`„To už je na dnes veľa. Nechajme to na inokedy.“`,
         `„Rozumiem, že to súvisí. Ale dnes už nie.“`,
         `„Jednu vec som podpísal. Druhú si ešte premyslím.“`])
  : rnd([`„Počkajte — to s tým nemá nič spoločné.“`,
         `„Vy ma chcete obchodiť naraz? Nie.“`,
         `„Toto už je predaj, nie poradenstvo.“`]);
 sBad(); M.faza="dopredaj"; meetDraw();
}

 if(k){k.stav="klient";k.dov=Math.round(M.roz.dovera/3);

function novyDen(){
 S.faza=0;S.den++;
 if(Math.random()<0.4)logg(rnd(AMBIENT),"dim");
 S.zdravie=Math.max(0,S.zdravie-0.6);
 S.buff.trpDnes=0;
 if(zna("partner")&&vz("partner")<30)pridajStres(1);
 pridajStres(-0.3);   /* noc odplaví len málo */
 pridajPohodu(-(1+S.stres/40)-(vz("partner")<40?0.6:0)+(vz("partner")>=70?0.4:0));
 if(S.dlh>0)pridajStres(0.6);
 S.maxE=maxEnergia();
 S.energia=Math.max(1,S.maxE+S.buff.enZajtra);
 S.buff.enZajtra=0;
 if(S.zdravie<25&&Math.random()<.25){S.energia=Math.max(1,Math.floor(S.energia/2));
  logg("Ráno si sa zobudil chorý. Polovica energie.","red")}
 if(jeVikend(S.den))S.vikendHotovy=false;
 S.volalDnes=false;          /* nový deň, nový zoznam čísel */
 if(typeof cloudZalohujDen==="function")cloudZalohujDen();
 checkLevel();
 if(S.den>DNI){S.den=1;endMonth();return true}
 if(spracujPovysenie()){povysenieObrazovka();return true}
 return false;
}

   Zdravie <b>${Math.round(S.zdravie)}</b>
   <br><span class="dim">Vzťahy za mesiac ochladli. Kto sa neozve, na toho sa zabudne.</span></div>
  <hr><p class="center" style="font-size:16px">Bilancia: <b class="${bal>=0?"green":"red"}">${bal>=0?"+":""}${bal.toFixed(2)} €</b></p>
  ${S.dlh>0?`<p class="center red" style="font-size:11px">Dlh voči agentúre: ${Math.round(S.dlh)} €</p>`:""}
  ${lvlUp?`<div class="panel2 center" style="border-color:var(--money)">
    <b class="money-t">Podmienky na úroveň ${S.povysenie.na} SPLNENÉ</b><br>
    <span style="font-size:11px">${LVL_NAME[S.povysenie.na]||""} · schválenie o ${dniDoPovysenia()} ${dniDoPovysenia()===1?"deň":"dní"}${S.povysenie.zdrzanie?" (Roman to nikam neponáhľa)":""}</span></div>`:""}
  ${S.povysenie&&!lvlUp?`<div class="panel2 center" style="font-size:11px">Povýšenie na úroveň ${S.povysenie.na} — zostáva ${dniDoPovysenia()} dní.</div>`:""}
  <div class="panel2" style="font-size:11px"><span class="gold">Tabuľa:</span>
   ${spravy.povysenia.length?`povýšení ${spravy.povysenia.length}`:"nikoho nepovýšili"} ·
   odišlo ${spravy.odchody.length} · prišlo ${spravy.prichody.length}
   ${spravy.odchody.length?`<br><span class="dim">Skončili: ${spravy.odchody.map(k=>k.meno+" "+k.priez).join(", ")}</span>`:""}</div>
  <button class="btn-go" onclick="${dane?"taxEvent()":"afterMonth()"}">${dane?"Daňové priznanie →":"Ďalší mesiac →"}</button></div>`;
 S.unMinulyMesiac=S.unMonth;S.unMonth=0;S.mesiac++;
 bal<0?sBad():sCash();
 autosave();
}
function taxEvent(){
 app.innerHTML=`<div class="panel"><h2>Daňové priznanie</h2>
 <p style="font-size:12px;margin-bottom:8px">Za uplynulé obdobie musíš podať priznanie.</p>
 <button onclick="taxRes(0)">Podám si sám <span class="dim">— 0 € · riziko 45 %</span></button>
 <button onclick="taxRes(1)">Lacný účtovník <span class="dim">— 80 € · riziko 20 %</span></button>
 <button onclick="taxRes(2)">Drahý účtovník <span class="dim">— 350 € · bez rizika</span></button>
 <p class="dim" style="font-size:10px;margin-top:6px">Organizácia ${A("org")}/10${A("org")>=6?' — <span class="green">−10 b. b. riziko</span>':""}</p></div>`;
}
function taxRes(v){
 if(S.flags.taxRok===S.mesiac)return; S.flags.taxRok=S.mesiac; S.flags.taxDone=true;
 const cena=[0,80,350][v]; let risk=[.45,.20,0][v]; if(A("org")>=6)risk=Math.max(0,risk-.10);
 zaplat(cena); const fail=Math.random()<risk;
 if(fail){const p=180+Math.floor(Math.random()*320);zaplat(p);pridajRep(-5);
  logg(`Chyba v daňovom priznaní. Doplatok a pokuta ${p} €.`,"red");sBad()}
 else{logg("Daňové priznanie podané bez problémov.","green");sGood()}
 if(S.money<0){S.dlh+=-S.money;S.money=0}
 app.innerHTML=`<div class="panel center"><h2>${fail?"Daňový úrad našiel chybu":"Vybavené"}</h2>
  <p style="margin:8px 0">${fail?"Doplatok, pokuta a kontrola.":"Priznanie prešlo. Máš pokoj na rok."}</p>
  <button class="btn-go" onclick="afterMonth()">Pokračovať →</button></div>`;
}
function afterMonth(){
 if(S.mesiac>MESIACE){S.scr="end";SC=null;render();return}
 if(S.pendingPts>0){S.flags.fromMonth=true;levelUpScreen();return}
 if(vztahovaUdalost())return;
 story();
}
function vztahovaUdalost(){
 const u=cakajucaUdalost(); if(!u)return false;
 odomkniVztah(u.id,u.start);
 logg(`Spoznal si nového človeka: ${menoCloveka(u.id)}.`,"gold");
 app.innerHTML=`<div class="panel"><h2>${clovek(u.id).ikona} ${u.nadpis}</h2>
  <p style="font-size:12px;margin:8px 0">${u.txt}</p>
  <div class="panel2" style="font-size:11px;border-color:var(--gold)">
   <span class="gold">${menoCloveka(u.id)} pribudol medzi tvoje vzťahy.</span><br>
   ${clovek(u.id).popis}</div>
  <button class="btn-go" onclick="afterMonth()">Pokračovať →</button></div>`;
 sGood(); return true;
}
function levelUpScreen(){
 const p=S.pendingPts;
 app.innerHTML=`<div class="panel"><h2>Rozdelenie bodov</h2>
 <p class="dim" style="font-size:11px;margin-bottom:8px">Zostáva <b class="money-t">${p}</b>.</p>
 ${ATTRS.map(([k,nm])=>`<div class="attr"><span class="nm">${nm}</span>
  <span class="bar"><i style="width:${A(k)*10}%"></i></span><span class="vl">${A(k)}/10</span>
  <button class="btn-sm mini" ${A(k)>=10||p<=0?"disabled":""} onclick="addPt('${k}')">+</button></div>`).join("")}
 ${p<=0?`<button class="btn-go" onclick="S.pendingPts=0;afterLevelUp()">Pokračovať →</button>`
        :`<p class="dim center" style="font-size:11px">Rozdeľ všetky body.</p>`}</div>`;
}
function addPt(k){S.attrs[k]++;S.pendingPts--;S.maxE=maxEnergia();sClick();levelUpScreen()}
function afterLevelUp(){
 if(S.flags.fromMonth){S.flags.fromMonth=false;afterMonth();return}
 render();
}

/* ===================== PRÍBEH ===================== */
function story(){
 if(S.mesiac>MESIACE){S.scr="end";SC=null;render();return}
 const m=S.mesiac; SC=null;
 if(m===3&&!S.flags.s1)SC={f:"s1",t:"Roman ťa zavolal do zasadačky",
  b:"„Pozri sa na tabuľku. Viem, prečo si dole. Nepredávaš IŽP.“<br><br>Poklepal po papieri.<br><br>„Stoštyridsať jednotiek. Jedna zmluva. Rozmýšľaj.“",
  o:[["„Rozmyslím si to.“",()=>{}],
     ["„Nemyslím si, že to ľudia potrebujú.“",()=>{pridajRep(4);S.flags.integ=(S.flags.integ||0)+1}]]};
 if(m===5&&!S.flags.s2)SC={f:"s2",t:"Pán Kováč, 71 rokov",
  b:"Sedí oproti tebe s obálkou. Vnútri je 14 000 €. Celý život.<br><br>„Ja tomu nerozumiem, ja verím vám.“<br><br>Roman ti cez stôl posunul papier. IŽP. Viazanosť dvadsať rokov.",
  o:[["Podpísať IŽP — 140 UN",()=>{const un=Math.max(1,Math.round(140*(S.lvl===1?.2:1)));
      S.unTotal+=un;S.unMonth+=un;S.papiere++;
      if(!Array.isArray(S.papiereZoz))S.papiereZoz=[];
      S.papiereZoz.push(`IŽP — pán Kováč (${S.mesiac}/${S.den})`);
      S.storna.push({m:S.mesiac+3,un,eur:un*UN_RATE[S.lvl]*(1-TAX),kid:0,prod:"IŽP"});
      S.flags.kovac="izp";logg("Pán Kováč podpísal IŽP. +"+un+" UN","money-t");sCash()}],
     ["Poslať ho na termínovaný vklad — 0 UN",()=>{pridajRep(10);S.flags.kovac="cisto";
      S.flags.integ=(S.flags.integ||0)+1;logg("Pán Kováč odišiel s odporúčaním, z ktorého nemáš nič.","green")}]]};
 if(!SC){render();return}
 S.flags[SC.f]=true;
 app.innerHTML=`<div class="panel"><h2>${SC.t}</h2><p style="margin:8px 0;font-size:12px">${SC.b}</p>
  ${SC.o.map((o,i)=>`<button onclick="storyPick(${i})">${o[0]}</button>`).join("")}</div>`;
}
function storyPick(i){const sc=SC;if(!sc||!sc.o[i])return;SC=null;sc.o[i][1]();sClick();render()}

/* ===================== EPILÓG ===================== */
function scrEnd(){
 const fit=S.zmluvy.filter(z=>z.fit).length, mis=S.zmluvy.length-fit;
 const kl=Object.values(S.klienti);
 app.innerHTML=`<div class="panel"><h1>Koniec vertical slice</h1>
 <p class="dim" style="font-size:11px;margin-bottom:8px">Šesť mesiacov. Plná hra pokračuje ďalšie dva a pol roka.</p>
 <div class="panel2">Úroveň: <b>${S.lvl}</b> — ${LVL_NAME[S.lvl]||""}</div>
 <div class="panel2">Jednotky: <b class="money-t">${S.unTotal} UN</b></div>
 <div class="panel2">Hotovosť: <b class="money-t">${Math.round(S.money)} €</b>${S.dlh>0?` · <b class="red">dlh ${Math.round(S.dlh)} €</b>`:""}</div>
 <div class="panel2">Reputácia: <b>${Math.round(S.rep)}</b>/100 · Zdravie: <b>${Math.round(S.zdravie)}</b>/100</div>
 <div class="panel2">Zmluvy: <b class="green">${fit} vhodných</b> · <b class="red">${mis} nevhodných</b></div>
 <div class="panel2">Ľudia v databáze: <b>${kl.length}</b> · stratení: <b class="red">${kl.filter(k=>k.stav==="stratený").length}</b></div>
 ${S.storna.length?`<div class="panel2"><b class="red">Tiká ďalších ${S.storna.length} storien.</b><br>
   <span style="font-size:11px">V plnej hre by dorazili v druhom roku — aj s podielom z provízií tvojich podriadených.</span></div>`:""}
 ${S.trvaleE>0?`<div class="panel2" style="border-color:var(--red)"><span style="font-size:11px">Trvalá strata energie: −${S.trvaleE}. Telo si účet vypýtalo skôr než trh.</span></div>`:""}
 ${S.flags.kovac==="izp"?`<div class="panel2" style="border-color:var(--red)"><span style="font-size:11px">Pán Kováč sa v plnej hre vráti v treťom roku. So synom a s právnikom.</span></div>`:""}
 ${S.flags.kovac==="cisto"?`<div class="panel2" style="border-color:var(--green)"><span style="font-size:11px">Pán Kováč ťa v plnej hre odporučí siedmim ľuďom.</span></div>`:""}
 <hr><button class="btn-go" onclick="newGame();render()">Hrať znova →</button>
 <p class="verzia" style="margin-top:6px">PROVÍZIA · prototyp v${HRA}</p></div>`;
 sGood();
}


app=document.getElementById("app");
function render(){try{
  if(S&&(!S.vztahy||!isFinite(S.stres)||S.v!==VERZIA))S=migrujStav(S)||S;
  const f={phone:scrPhone,cv:scrCV,face:scrFace,attr:scrAttr,game:scrGame,end:scrEnd,resume:scrResume}[S.scr];
  if(!f){S.scr="phone";return scrPhone()}
  S.scr==="resume"?f(window.__auto):f();
  window.scrollTo(0,0);
}catch(e){
  app.innerHTML='<div class="panel"><h2>Nie\u010do sa pokazilo</h2>'
   +'<p style="font-size:12px;margin:8px 0">'+String(e.message||e)+'</p>'
   +'<button class="btn-go" onclick="doResume()">Obnovi\u0165 z posledn\u00e9ho ulo\u017eenia</button>'
   +'<button onclick="newGame();render()">Za\u010da\u0165 odznova</button></div>';
}}
window.addEventListener("error",function(ev){
  if(!app||!app.innerHTML)return;
  console.error(ev.error);
});
tipZapoj();
try{cloudSpracujNavrat()}catch(e){}
newGame();
(async()=>{
  const a=await maAutosave();
  if(a){window.__auto=a;S.scr="resume"}
  render();
  /* na pozadí sa overí, či na účte nie je novšia pozícia */
  try{
    if(typeof cloudKontrolaPriStarte==="function"&&S.scr==="game")
      await cloudKontrolaPriStarte();
  }catch(e){}
})();
</script>
</body>
</html>
