<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>PROVÍZIA</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a84ff'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23fff' font-family='-apple-system,sans-serif' font-weight='700'%3E%E2%82%AC%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">

<style>
/* ===================== DIZAJN =====================
   Systémové farby a tvary v duchu iOS: plochy namiesto rámčekov,
   výrazné zaoblenia, jemné oddeľovače a jediná akcentová farba. */
:root{
  /* podklady */
  --bg:#000000; --panel:#1c1c1e; --panel2:#2c2c2e; --panel3:#3a3a3c;
  --line:rgba(84,84,88,.42); --line2:rgba(84,84,88,.62);
  /* text */
  --text:#ffffff; --dim:rgba(235,235,245,.6); --dim2:rgba(235,235,245,.3);
  --beige:#ffffff;
  /* systémové farby */
  --modra:#0a84ff; --green:#30d158; --red:#ff453a; --gold:#ff9f0a;
  --money:#ffd60a; --un:#64d2ff; --blue:#0a84ff; --fialova:#bf5af2;
  --r:14px; --r2:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",
    "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;letter-spacing:-.01em;
  padding:8px 8px 18px;-webkit-font-smoothing:antialiased}
#app{max-width:430px;margin:0 auto}
canvas{image-rendering:pixelated;display:block}
.cislo,.money-t,.un-t,.peniaze{font-variant-numeric:tabular-nums}

/* ---- typografia ---- */
h1,h2,h3{line-height:1.25;letter-spacing:-.022em}
h1{font-size:28px;font-weight:700;color:var(--text)}
h2{font-size:21px;font-weight:700;color:var(--text);margin-bottom:2px}
h3{font-size:14px;font-weight:600;color:var(--dim);margin:16px 0 7px;letter-spacing:-.01em}
.podnadpis{font-size:14px;color:var(--dim);line-height:1.4;margin-bottom:12px}
.mala{font-size:14px;line-height:1.42}
.center{text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---- plochy ---- */
.panel{background:var(--panel);border-radius:var(--r);padding:14px;margin-bottom:10px}
.panel2{background:var(--panel2);border-radius:var(--r2);padding:11px 13px;margin-bottom:8px;
  font-size:14px;line-height:1.42}
.karta{background:var(--panel2);border-radius:var(--r2);padding:11px 13px;margin-bottom:8px;
  border-left:3px solid transparent;font-size:14px}
.karta.zvyraz{border-left-color:var(--money);background:#2e2a17}
.karta.dobre{border-left-color:var(--green);background:#172c1d}
.karta.zle{border-left-color:var(--red);background:#2e1a19}
.karta.pozor{border-left-color:var(--gold);background:#2e2618}

/* ---- tlačidlá ako riadky zoznamu ---- */
button{font-family:inherit;font-size:16px;background:var(--panel2);color:var(--text);
  border:0;border-radius:var(--r2);padding:13px 34px 13px 15px;cursor:pointer;width:100%;
  text-align:left;margin-bottom:8px;line-height:1.35;position:relative;
  transition:background .12s,transform .08s;letter-spacing:-.01em}
button::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-52%);
  color:var(--dim2);font-size:20px;font-weight:600;line-height:1}
button:hover:not(:disabled){background:var(--panel3)}
button:active:not(:disabled){transform:scale(.985);background:var(--panel3)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--modra);outline-offset:2px}
button .dim,button .mala{font-size:13.5px}
.btn-go{background:var(--modra);color:#fff;text-align:center;font-weight:600;
  padding:14px;border-radius:12px;margin-top:4px}
.btn-go::after{content:""}
.btn-go:hover:not(:disabled){background:#3d9bff}
.btn-tichy{background:transparent;color:var(--modra);text-align:center;font-weight:500}
.btn-tichy::after{content:""}
.btn-sm{width:auto;display:inline-block;padding:9px 15px;margin-right:6px;font-size:14.5px;
  text-align:center;border-radius:10px}
.btn-sm::after{content:""}
.mini{width:32px!important;padding:7px 0;text-align:center}
.mini::after{content:""}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* ---- formuláre ---- */
input,select,textarea{font-family:inherit;font-size:16px;background:var(--panel2);
  color:var(--text);border:0;border-radius:10px;padding:12px;width:100%;margin-bottom:10px}
textarea{font-size:12px;line-height:1.4;word-break:break-all;resize:vertical;
  font-family:ui-monospace,Menlo,monospace}
label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px}

/* ---- telefón ---- */
.telefon{background:var(--panel);border-radius:26px;padding:0 0 12px;overflow:hidden}
.telefon>#body{padding:0 12px}
.stav{display:flex;justify-content:flex-start;align-items:center;gap:7px;
  padding:11px 16px 9px;font-size:13.5px;font-weight:600;color:var(--dim);
  letter-spacing:-.01em}
/* v režime celej obrazovky netreba hore ďalšiu medzeru — rieši ju už telo stránky */
@media(display-mode:standalone){
  body{padding-top:max(4px,env(safe-area-inset-top,0px))}
  .telefon{border-top-left-radius:14px;border-top-right-radius:14px}
}
.stav .cas{color:var(--text)}

/* ---- profil ---- */
.profil{padding:2px 14px 14px;background:var(--panel)}
.profil .hlavicka{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.profil canvas{border-radius:50%;background:var(--panel2);flex:0 0 auto}
.profil .kto{display:flex;flex-direction:column;min-width:0}
.profil .kto b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.profil .kto span{font-size:14px;color:var(--dim)}
.profil .kto .cerv{color:var(--red)}
.chipy{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.chip{background:var(--panel2);border-radius:11px;padding:9px 3px 7px;text-align:center;
  display:flex;flex-direction:column;gap:1px}
.chip b{font-size:16px;font-weight:600;line-height:1.15;letter-spacing:-.02em}
.chip i{font-style:normal;font-size:10px;color:var(--dim)}
.chip .peniaze{color:var(--money)}
.chip .jednotky{color:var(--un)}
.chip.pozor{background:#33290f} .chip.pozor b{color:var(--gold)}
.chip.zle{background:#331816} .chip.zle b{color:var(--red)}

/* ---- plocha s aplikáciami ---- */
.plocha{display:grid;grid-template-columns:repeat(4,1fr);gap:15px 6px;
  margin:15px 0 19px;padding:0 2px}
.appik{position:relative;width:100%;margin:0;padding:0;background:transparent;
  text-align:center;border-radius:0}
.appik::after{content:""}
.appik:hover:not(:disabled){background:transparent}
.appik:active:not(:disabled){transform:scale(.92)}
/* Dlaždica má pokojnú veľkosť, ale znak v nej vypĺňa takmer celú plochu —
   tak ako na skutočnej ikone aplikácie. */
.appik .ik{display:grid;place-items:center;
  width:58px;height:58px;margin:0 auto 7px;border-radius:14px;
  font-size:44px;line-height:1;text-align:center;
  background:var(--panel2);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.appik .nm{display:block;font-size:12px;color:var(--text);letter-spacing:-.01em;opacity:.95}
/* Pozadie je protikladom farby znaku, aby na ňom vynikol:
   žlté slnko na modrom, zelené slúchadlo na purpurovom, červený kalendár
   na tyrkysovom, modrí ľudia na jantárovom, červené srdce na zelenom. */
.appik.a-dnes .ik{background:linear-gradient(160deg,#2f6bff,#1b3fb8)}
.appik.a-crm .ik{background:linear-gradient(160deg,#c93bd6,#8d1f9e)}
.appik.a-kal .ik{background:linear-gradient(160deg,#22c9c0,#0e8e8a)}
.appik.a-kli .ik{background:linear-gradient(160deg,#ffb03a,#e07b06)}
.appik.a-fir .ik{background:linear-gradient(160deg,#ff9a3c,#d1600a)}
.appik.a-ja .ik{background:linear-gradient(160deg,#34d97f,#129152)}
.appik.a-nak .ik{background:linear-gradient(160deg,#3ad6b0,#12907a)}
.appik.a-kas .ik{background:linear-gradient(160deg,#3f7bff,#1b3fb8)}
.appik.a-set .ik{background:linear-gradient(160deg,#7b5cf5,#4c2fb0)}
.odznak{position:absolute;top:-5px;right:6px;min-width:21px;height:21px;line-height:21px;
  padding:0 6px;border-radius:11px;font-size:11.5px;font-weight:600;z-index:2;
  background:var(--panel3);color:var(--text);box-shadow:0 0 0 2px var(--panel)}
.odznak.cerv{background:var(--red);color:#fff}
.odznak.gold{background:var(--gold);color:#1c1c1e}

/* ---- hlavička aplikácie ---- */
.appbar{display:flex;align-items:center;gap:6px;margin:0 0 4px;padding:2px 0 10px}
.appbar .spat{width:auto;flex:0 0 auto;margin:0;padding:2px 8px 2px 0;background:transparent;
  color:var(--modra);font-size:26px;line-height:1;font-weight:400}
.appbar .spat::after{content:""}
.appbar .spat:hover{background:transparent;opacity:.7}
.appbar .nadpis{font-size:26px;font-weight:700;letter-spacing:-.024em}
.appsub{margin:0 0 12px}

/* ---- text a farby ---- */
.dim{color:var(--dim)} .green{color:var(--green)} .red{color:var(--red)}
.money-t{color:var(--money)} .un-t{color:var(--un)} .gold{color:var(--gold)}
.beige{color:var(--text)} .cerv{color:var(--red)}

/* ---- pásy ---- */
.bar{display:block;height:7px;background:var(--panel3);border-radius:4px;
  margin:5px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .25s}
.greenb{background:var(--green)} .goldb{background:var(--gold)} .redb{background:var(--red)}
.stresb{background:linear-gradient(90deg,var(--green),var(--gold) 55%,var(--red))}

/* ---- denník ---- */
.log{max-height:220px;overflow-y:auto;font-size:14px;line-height:1.4}
.log p{padding:8px 0;border-bottom:1px solid var(--line)}
.log p:last-child{border-bottom:0}

/* ---- atribúty a potreby ---- */
.attr,.need{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:14px}
.attr .nm{width:108px;color:var(--dim)}
.need .nm{width:80px;color:var(--dim)}
.attr .bar,.need .bar{flex:1;margin:0}
.attr .vl{width:40px;text-align:right;font-weight:600}
.need .vl{width:36px;text-align:right;font-weight:600}

/* ---- výber portrétu ---- */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pick canvas{width:100%;background:var(--panel2);border-radius:12px;cursor:pointer;
  border:2px solid transparent}
.pick canvas.sel{border-color:var(--modra)}

/* ---- filtre ---- */
.filtre{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.filtre button{width:auto;margin:0;padding:8px 13px;font-size:14px;text-align:center;
  background:var(--panel2);border-radius:9px}
.filtre button::after{content:""}
.filtre button.on{background:var(--modra);color:#fff;font-weight:600}
.strany{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:10px;font-size:14px;color:var(--dim)}
.strany button{width:auto;margin:0}

/* ---- kalendár ---- */
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.cd{background:var(--panel2);border-radius:10px;padding:9px 2px;text-align:center;
  line-height:1.3;font-size:14px}
.cd b{font-size:15px;display:block;font-weight:600}
.cd i{display:block;font-style:normal;font-size:11px;color:var(--money)}
.cd.dnes{background:var(--modra);color:#fff}
.cd.dnes i{color:#fff}
.cd.pass{opacity:.3}
.cd.vik{background:#1c1c1e}
.cd.vik b{font-size:11px;color:var(--dim)}

/* ---- tabuľka ---- */
.tab{border-radius:var(--r2);margin-top:8px;overflow:hidden;background:var(--panel2)}
.tr{display:grid;grid-template-columns:26px 1fr 46px 60px;gap:7px;padding:10px 13px;
  border-bottom:1px solid var(--line);font-size:14px;align-items:center;cursor:pointer}
.tr:last-child{border-bottom:0}
.tr.th{background:transparent;color:var(--dim);font-size:12px;cursor:default;font-weight:600}
.tr.ja{background:rgba(10,132,255,.16)}
.tr.ja span{color:var(--text);font-weight:600}
.tr .lvl{text-align:center;color:var(--dim);font-size:12px}
.tr .un{text-align:right;color:var(--un);font-variant-numeric:tabular-nums}
.tr i{font-style:normal;font-size:11px;margin-left:5px}
.tr:hover:not(.th):not(.ja){background:var(--panel3)}

/* ---- úvodná obrazovka ---- */
.phone{background:var(--panel);border-radius:26px;padding:18px 14px}
.job{background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:9px;opacity:.42}
.job.hot{opacity:1;background:var(--panel2);border-left:3px solid var(--money)}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:8px;
  margin-right:5px;color:var(--dim);background:var(--panel3)}

.ticker{font-size:34px;font-weight:700;color:var(--un);text-align:center;
  letter-spacing:-.03em;padding:8px 0;line-height:1.2}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.35}}
.verzia{text-align:center;font-size:11.5px;color:var(--dim2);padding:10px 0 2px}

/* ---- nápoveda ---- */
.napoveda .krok{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.napoveda .cislo{flex:0 0 26px;height:26px;border-radius:13px;background:var(--modra);
  color:#fff;text-align:center;line-height:26px;font-size:13px;font-weight:600}
.napoveda .txt{flex:1;font-size:14.5px;line-height:1.42}

/* ---- karty v kasíne ---- */
.karta-r{display:inline-block;min-width:40px;padding:9px 7px;margin:3px 4px 3px 0;
  text-align:center;background:#f2f2f7;color:#1c1c1e;border-radius:7px;
  font-weight:700;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.karta-r.cerv{color:#ff3b30}
.karta-r.rub{background:var(--panel3);color:var(--dim2)}
.karty{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.kartabtn{width:100%;margin:0;padding:8px 3px;text-align:center;line-height:1.3;
  background:var(--panel2);border-radius:10px}
.kartabtn::after{content:""}
.kartabtn.drz{background:rgba(10,132,255,.2);box-shadow:inset 0 0 0 2px var(--modra)}
.kartabtn .mala{display:block;color:var(--dim);font-size:11px}

/* ---- stávky a kurzy ---- */
.kurzbtn{width:100%;margin:0;padding:8px 0;text-align:center;font-size:14px;
  background:var(--panel3);border-radius:9px;font-weight:600}
.kurzbtn::after{content:""}
.kurzbtn.zvol{background:var(--modra);color:#fff}
.minca{background:var(--panel2);border-radius:var(--r2);padding:12px;margin-bottom:9px}
.minca .hlava{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.minca .kurz{font-weight:700;font-size:17px;letter-spacing:-.02em}
.minca button{margin-top:8px;margin-bottom:0}
.graf{width:100%;height:38px;display:block;margin:5px 0}


/* ---- bublina s nápovedou ---- */
.tip{position:fixed;z-index:999;max-width:280px;background:#48484a;color:#fff;
 padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.4;
 box-shadow:0 8px 26px rgba(0,0,0,.6);pointer-events:none;
 opacity:0;transform:translateY(5px) scale(.97);
 transition:opacity .16s ease,transform .16s ease}
.tip.on{opacity:1;transform:none}
.tipik{color:var(--dim2);font-size:12.5px;margin-left:3px;vertical-align:middle}
[data-tip]{cursor:help}
button[data-tip]{cursor:pointer}
.attr[data-tip]{border-radius:8px;padding:2px 4px;margin-left:-4px}
.attr[data-tip]:hover{background:var(--panel2)}

/* ---- mobil ---- */
/* Pridané na plochu telefónu beží hra cez celý displej — obsah preto musí
   uhnúť ostrovčeku a domovskej čiarke, inak sa schová pod ne. */
body{padding-top:max(8px,env(safe-area-inset-top,0px));
 padding-left:max(8px,env(safe-area-inset-left,0px));
 padding-right:max(8px,env(safe-area-inset-right,0px));
 padding-bottom:max(18px,env(safe-area-inset-bottom,0px));
 min-height:100dvh;
 -webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
/* Bublina s nápovedou sa tiež nesmie schovať pod ostrovček. */
.tip{margin-top:env(safe-area-inset-top,0px)}
@media(max-width:400px){
 .chipy{gap:5px}
 .chip b{font-size:14px} .chip i{font-size:9px}
 .appik .ik{width:54px;height:54px;font-size:40px}
 h1{font-size:25px} .appbar .nadpis{font-size:23px}
}
@media(hover:none){ [data-tip]{cursor:default} }
/* ---- animácie kasína ---- */
@keyframes kartaPrichod{from{opacity:0;transform:translateY(-20px) rotate(-7deg) scale(.88)}
 to{opacity:1;transform:none}}
@keyframes kartaOtoc{0%{transform:rotateY(90deg) scale(.9);opacity:.35}
 60%{transform:rotateY(-12deg) scale(1.04)}100%{transform:none;opacity:1}}
.karta-r.nova{animation:kartaPrichod .34s cubic-bezier(.2,.9,.3,1.2) backwards}
.karta-r.otoc{animation:kartaOtoc .42s ease-out backwards}
/* Valec: pás má vždy rovnakú dĺžku, takže sa dá dotočiť presne na doraz.
   Kľúčové snímky majú pevné hodnoty — premenná v @keyframes sa v niektorých
   prehliadačoch neinterpoluje a valec sa zastavil medzi symbolmi. */
@keyframes toc1{from{transform:translateY(0)}to{transform:translateY(-2262px)}}
@keyframes toc2{from{transform:translateY(0)}to{transform:translateY(-2262px)}}
@keyframes toc3{from{transform:translateY(0)}to{transform:translateY(-2262px)}}
.valce{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.valec{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);
 height:78px;overflow:hidden;position:relative}
.valec .pas{display:block;will-change:transform}
.valec .pas span{display:flex;align-items:center;justify-content:center;
 height:78px;font-size:34px;line-height:1}
.valec.v1 .pas{animation:toc1 1.05s cubic-bezier(.12,.72,.22,1) forwards}
.valec.v2 .pas{animation:toc2 1.35s cubic-bezier(.12,.72,.22,1) forwards}
.valec.v3 .pas{animation:toc3 1.65s cubic-bezier(.12,.72,.22,1) forwards}
.valec::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(180deg,rgba(14,16,22,.35),transparent 16%,transparent 84%,rgba(14,16,22,.35))}
@keyframes zaverIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.zaver{animation:zaverIn .32s ease-out backwards}
@keyframes vyhraPuls{0%,100%{box-shadow:0 0 0 0 rgba(232,255,61,0)}
 50%{box-shadow:0 0 0 7px rgba(232,255,61,.16)}}
.zaver.vyhra{animation:zaverIn .32s ease-out backwards,vyhraPuls 1.1s ease-in-out .3s 2}
@keyframes prehraTras{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}
 40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.zaver.prehra{animation:zaverIn .3s ease-out backwards,prehraTras .42s ease-in-out .28s 1}
@keyframes plavakHore{from{opacity:1;transform:translateY(0) scale(1)}
 to{opacity:0;transform:translateY(-30px) scale(1.15)}}
.plavak{display:inline-block;margin-left:8px;font-weight:700;
 animation:plavakHore 1.3s ease-out .35s forwards}
@keyframes tikanie{from{opacity:.35}to{opacity:1}}
.tik{animation:tikanie .5s ease-out backwards}
@media(prefers-reduced-motion:reduce){
 .karta-r.nova,.karta-r.otoc,.valec .pas,.zaver,.plavak,.tik{animation:none!important}
 .valec .pas{transform:translateY(-2262px)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Na čo je ktorý atribút — text sa ukáže pri podržaní prsta. */
const POPIS_ATRIB={
 kom:"Úspešnosť telefonátov. Koľko ľudí z databázy vôbec dostaneš na stretnutie.",

function naladaWeights(seg){
 const lepsia=((typeof lepsiaDB==="function")?lepsiaDB():S.lvl>=3)||(seg&&seg.kvalita>=1);
 const bonus=(seg?seg.kvalita:0)*3;
 return NALADY.map(n=>({n, w:Math.max(1,(lepsia?n.w2:n.w)+(n.bonus>0?Math.floor(S.rep/40)+bonus:-bonus))}));
}
function losujNaladu(seg){
 const w=naladaWeights(seg), sum=w.reduce((a,x)=>a+x.w,0);
 let r=Math.random()*sum;
 for(const x of w){r-=x.w;if(r<=0)return x.n}
 return NALADY[1];
}

/* Neznámy alebo chýbajúci segment vždy znamená studený kontakt.
   Nikdy nie „prvý v zozname“ — to by miešalo rozhovory z rôznych databáz. */
const SEG_VYCHODZI="studene";
const segment=id=>SEGMENTY.find(s=>s.id===id)||SEGMENTY.find(s=>s.id===SEG_VYCHODZI);
function segmentOdomknuty(s){
 if(S.lvl<s.odomkne.lvl)return false;
 if(S.rep<s.odomkne.rep)return false;
 return true;
}
function zasobaSegmentu(id){
 const s=segment(id);
 if(s.zasoba===null)return null;                 /* studené sú nekonečné */
 if(!S.crmZasoba)S.crmZasoba={};
 if(S.crmZasoba[id]===undefined)S.crmZasoba[id]=s.zasoba;
 return S.crmZasoba[id];
}
function dopnZasoby(){
 S.crmZasoba=S.crmZasoba||{};
 SEGMENTY.forEach(s=>{
  if(s.zasoba===null)return;
  if(s.dopln!==undefined){                       /* okruh známych sa obnovuje len pomaly */
   const teraz=S.crmZasoba[s.id]===undefined?s.zasoba:S.crmZasoba[s.id];
   S.crmZasoba[s.id]=Math.min(s.zasoba,teraz+s.dopln);
  } else S.crmZasoba[s.id]=s.zasoba;
 });
}
function minZasobu(id){
 const s=segment(id); if(s.zasoba===null)return;
 S.crmZasoba=S.crmZasoba||{};
 if(S.crmZasoba[id]===undefined)S.crmZasoba[id]=s.zasoba;
 S.crmZasoba[id]=Math.max(0,S.crmZasoba[id]-1);
}

/* ===================== POTREBY ===================== */
/* Stres 0–100 (viac = horšie) · Pohoda 0–100 (viac = lepšie) · Zdravie 0–100 */

function stresPostih(){ const s=+S.stres||0; if(s>=85)return 2; if(s>=65)return 1; return 0 }
function pohodaBonus(){ const p=isFinite(S.pohoda)?S.pohoda:50; if(p>=75)return 1; if(p<=25)return -1; return 0 }
function pridajStres(n,dovod){
 if(!isFinite(S.stres))S.stres=15;
 S.stres=Math.max(0,Math.min(100,S.stres+n));
 if(n>0&&S.stres>=85&&!S.flags.varovanieStres){S.flags.varovanieStres=true;
  logg("Ruky sa ti trasú aj keď netelefonuješ. Toto už nie je únava.","red")}
 if(S.stres<60)S.flags.varovanieStres=false;
}
function pridajPohodu(n){if(!isFinite(S.pohoda))S.pohoda=60;S.pohoda=Math.max(0,Math.min(100,S.pohoda+n))}
const stavStresu=()=>S.stres>=85?["red","na hrane"]:S.stres>=65?["gold","vysoký"]
 :S.stres>=40?["","zvládnuteľný"]:["green","nízky"];
const stavPohody=()=>S.pohoda>=75?["green","výborná"]:S.pohoda>=50?["","dobrá"]
 :S.pohoda>=25?["gold","slabá"]:["red","na dne"];

/* ===================== ENGINE ROZHOVOROV =====================
   Postavený na tom, ako taký hovor prebieha v skutočnosti:

   · Človek povie áno vtedy, keď súčasne vidí DÔVOD (záujem) a znesie TEBA (dôvera).
     Jedno bez druhého termín nedá — preto sú to dve osi, nie jedna.
   · Prvá námietka býva dymová clona. Skutočný dôvod príde až keď sa opýtaš.
   · Uznanie námietky buduje dôveru, ale samo nikam nevedie — treba ho premostiť.
   · Viac než tri námietky za hovor sa nedajú riešiť; štvrtá už rozhovor len naťahuje.
   · Opakovanie tej istej techniky znie ako čítanie zo skriptu.
   · Ochota stretnúť sa má strop, ktorý nezávisí od teba. Časť ľudí nepríde nikdy.        */

const TECHNIKY={
 otazka:   {nm:"otázka",      ik:"?", zaujem:.55, dovera:.45, trp:1, signal:2,
            popis:"Zisťuje. Otvára skutočný dôvod za námietkou."},
 oznacenie:{nm:"uznanie",     ik:"~", zaujem:.20, dovera:1.05, trp:1, signal:1,
            popis:"Pomenuje, čo klient cíti. Buduje dôveru, ale sama neposunie."},
 most:     {nm:"most",        ik:"→", zaujem:1.15, dovera:.30, trp:1, signal:0,
            popis:"Premostí od námietky k stretnutiu. Silné, ak mu niečo predchádzalo."},
 ram:      {nm:"rámovanie",   ik:"▣", zaujem:.95, dovera:.45, trp:1, signal:0,
            popis:"Vysvetlí dôvod hovoru. Základná stavebná kocka."},
 priamost: {nm:"priamosť",    ik:"!", zaujem:.55, dovera:.85, trp:1, signal:1,
            popis:"Úprimnosť aj vtedy, keď nie je príjemná. Riskantná, ale funguje."},
 ustup:    {nm:"ústup",       ik:"←", zaujem:.35, dovera:1.15, trp:0, signal:1,
            popis:"Dáš mu možnosť ukončiť to. Paradoxne často drží hovor."},
 tlak:     {nm:"tlak",        ik:"↑", zaujem:.85, dovera:-.55, trp:2, signal:0,

            popis:"Toto sa nemalo povedať."}

/* Osobnosť určuje, ktorá technika u koho zaberá. */
const CITLIVOST={
 analytik:{otazka:1.55, ram:1.5, most:1.1, oznacenie:.6, tlak:.3, priamost:1.15, ustup:.8},
 neduverc:{priamost:1.75, ustup:1.6, oznacenie:1.35, otazka:1.0, tlak:.2, ram:.6, most:.75},
 priatel: {oznacenie:1.75, otazka:1.3, ustup:1.15, priamost:.85, ram:.75, most:.95, tlak:.3},
 zanepraz:{most:1.65, priamost:1.3, ram:1.15, otazka:.65, oznacenie:.4, ustup:1.0, tlak:.85},
 setrny:  {ram:1.5, otazka:1.3, most:1.1, priamost:1.0, oznacenie:.8, tlak:.45, ustup:1.05},
 ambici:  {ram:1.6, most:1.3, priamost:1.15, otazka:.95, oznacenie:.5, tlak:.95, ustup:.7}
};
const citlivost=(k,t)=>((CITLIVOST[k&&k.persona]||{})[t]!==undefined?CITLIVOST[k.persona][t]:1);

/* Reťaz techník: uznanie → otázka → most je postup, ktorý sa učí každý obchodník. */
function bonusRetaze(hist,tech){
 const p=hist[hist.length-1], pp=hist[hist.length-2];
 if(tech==="most"&&(p==="otazka"||p==="oznacenie"))return p==="otazka"&&pp==="oznacenie"?2.1:1.55;
 if(tech==="otazka"&&p==="oznacenie")return 1.45;
 if(tech==="ram"&&p==="otazka")return 1.35;
 if(tech==="most"&&p==="most")return .6;      /* dva mosty za sebou = tlačíš */
 return 1;
}
/* Tá istá technika dvakrát po sebe znie ako scenár. */
function opakovanie(hist,tech){
 if(hist[hist.length-1]===tech)return .35;
 if(hist[hist.length-2]===tech&&hist[hist.length-1]===tech)return .2;
 return 1;
}

/* ---------- stav rozhovoru ---------- */
function novyRozhovor(k,nalada,ochota){
 return {
  zaujem: 3+Math.round(A("kom")*0.7)+(nalada&&nalada.bonus>0?14:0),
  dovera: 5+Math.round(A("dov")*1.5),
  trp: 100,
  ochota,                          /* skrytý strop 0–1 */
  hist:[],                         /* techniky v poradí */
  namietok:0, signalov:0, poznatky:[],
  klam:null,                       /* skutočná námietka za dymovou clonou */
  odhalene:false
 };
}
const R=()=>CRM&&CRM.roz;

/* Pripravenosť povedať áno. Dve osi, obe musia byť hore. */
/* Obe osi musia byť hore naraz. Kto vidí dôvod, ale neverí ti, sa nestretne —
   a naopak. Preto sa násobia, nie sčítavajú. */
function pripravenost(r){
 const z=Math.max(0,Math.min(100,r.zaujem))/100, d=Math.max(0,Math.min(100,r.dovera))/100;
 return Math.pow(Math.max(z,.01),.55)*Math.pow(Math.max(d,.01),.45);
}
function sancaNaTermin(r,k){
 const p=pripravenost(r);
 /* Naozaj dobrý rozhovor dokáže posunúť aj strop — človek, ktorý sa stretnúť nechcel,
    si to rozmyslí. Platí to až od vysokej pripravenosti, nie za priemernú prácu. */
 const strop=Math.min(.97,r.ochota+Math.max(0,p-.55)*.75);
 const trest=r.namietok>3?.55:1;                  /* štvrtá námietka už rozhovor len naťahuje */
 const cas=r.trp<25?.65:1;
 /* Krivka je zámerne strmá: rozdiel medzi „odrecitoval si to“ a „viedol si rozhovor“
    má byť násobný, nie o pár percent. */
 return Math.max(0,Math.min(stropSegmentu(k),Math.pow(p,2.35)*5.9*strop*trest*cas));
}
/* Odhad, ktorý hráč vidí — je tým presnejší, čím viac o človeku vie. */
function neistota(r){return Math.max(.03,.26-r.signalov*.045)}
function odhadSance(r,k){
 const s=sancaNaTermin(r,k), n=neistota(r);
 return {s, od:Math.max(0,s-n), do:Math.min(1,s+n), n};
}
/* Prah, od ktorého má zmysel pýtať si termín. Skoro = tvrdé nie. */
const PRAH_UZAVRETIA=.34;
const mozeUzavriet=r=>sancaNaTermin(r)>=PRAH_UZAVRETIA*.6;

/* ---------- vyhodnotenie jednej odpovede ---------- */
function pouziTechniku(r,k,o,cena){
 const t=TECHNIKY[o.tech]||TECHNIKY.priamost;
 const nas=citlivost(k,o.tech)*bonusRetaze(r.hist,o.tech)*opakovanie(r.hist,o.tech);
 /* Samotná „sila vety“ rozhoduje menej než to, či je technika na mieste. */
 const zaklad=o.v>=0?(0.9+o.v*0.5):(o.v*1.5);
 const sila=zaklad*nas;
 const dz=t.zaujem*sila*3.1, dd=t.dovera*sila*3.1;
 r.zaujem=Math.max(0,Math.min(100,r.zaujem+dz));
 r.dovera=Math.max(0,Math.min(100,r.dovera+dd));
 r.trp-=(cena!==undefined?cena:t.trp*(11+k.nar*2.6));
 r.hist.push(o.tech); if(r.hist.length>6)r.hist.shift();
 /* otázka a uznanie zisťujú — narastá presnosť odhadu a môžu odhaliť skutočný dôvod */
 let odhalil=false;
 if(t.signal){
  r.signalov+=t.signal;
  if(r.klam&&!r.odhalene&&o.tech==="otazka"&&o.v>=2){r.odhalene=true;odhalil=true;
   r.zaujem=Math.min(100,r.zaujem+10)}
 }
 return {dz:Math.round(dz), dd:Math.round(dd), nas, odhalil,
         opak:opakovanie(r.hist.slice(0,-1),o.tech)<1,
         retaz:bonusRetaze(r.hist.slice(0,-1),o.tech)>1};
}
/* ---------- signál po ťahu ---------- */
function dajSignal(r,k){
 if(Math.random()>.55)return null;
 const skupina = r.dovera<30?"nedovera" : r.zaujem<25?"nezaujem"
   : r.dovera>60?"dovera" : r.zaujem>55?"zaujem" : "casovy";
 r.signalov++;
 const s=rnd(SIGNALY[skupina]);
 if(r.poznatky.indexOf(s)<0)r.poznatky.push(s);
 if(r.poznatky.length>3)r.poznatky.shift();
 return s;
}

/* ===================== STRETNUTIE =====================
   Rovnaký engine ako pri telefonáte, plus vrstva navyše: kým nezistíš,
   čo človek naozaj potrebuje, nemáš čo odporúčať. Odhad naslepo klient spozná. */
function novyRozhovorStretnutie(k){
 const naliehavost={ochrana:.85,byvanie:.8,uver:.7,investicia:.6,dochodok:.55,auto:.5}[k.need]||.6;
 return {
  zaujem: 10+Math.round(A("emp")*1.1),
  dovera: 14+Math.round(A("dov")*2.0)+Math.round((k.dov||0)/3),
  trp: 100+pohodaBonus()*8-stresPostih()*8+(S.buff.trpDnes||0)*6-gambaPostih()*7,
  /* ochota podpísať — koľko z toho vieš vyťažiť, ak odvedieš prácu */
  /* Kto si na teba vyhradil hodinu, už je z veľkej časti rozhodnutý, že to chce riešiť.
     Strop je preto vysoko — o výsledku rozhoduje hlavne to, ako stretnutie vedieš. */
  ochota: Math.max(.55,Math.min(.97,.62+naliehavost*.3-k.nar*.02+Math.random()*.1
    +(k.seg==="prirodzeny"?.08:k.seg==="odporucania"?.05:0))),
  hist:[], namietok:0, signalov:0, poznatky:[], klam:null, odhalene:false
 };
}
/* Koľko z klientových faktov už poznáš (5 = aj skutočná potreba). */
const zistene=k=>(k.znama||[]).length;
function zhodaProduktu(k,p){
 if(!p)return 0;
 const vie=(k.znama||[]).indexOf(4)>=0;          /* pozná skutočnú potrebu? */
 if(p.need===k.need)return vie?1:.72;            /* trafil — vedome alebo náhodou */
 return vie?.28:.4;                              /* keď vieš a predáš iné, je to vedomé */
}
/* Ani u známeho to nie je isté. Vyšší strop než u cudzieho, ale nie stopercentný —
   práve pri známych sa najčastejšie povie „premyslím si to a ozvem sa“. */
const STROP_SEGMENTU={prirodzeny:.86, odporucania:.92, studene:.97};
const stropSegmentu=k=>STROP_SEGMENTU[k&&k.seg]!==undefined?STROP_SEGMENTU[k.seg]:.95;
function sancaNaPodpis(r,k,p,nevyriesene){
 const pr=pripravenost(r);
 const strop=Math.min(.97,r.ochota+Math.max(0,pr-.55)*.9);
 const zh=zhodaProduktu(k,p);
 const info=.72+.28*Math.min(1,zistene(k)/4);    /* kto sa nepýtal, strieľa naslepo */
 const cas=r.trp<25?.7:1;
 const nam=Math.max(.25,1-(nevyriesene||0)*.22);
 return Math.max(0,Math.min(stropSegmentu(k),Math.pow(pr,1.45)*1.95*strop*zh*info*cas*nam));
}

/* ===================== VIAZANÉ PRODUKTY =====================
   V realite sa zmluvy uzatvárajú v balíkoch. K hypotéke patrí krytie úveru
   a poistenie nehnuteľnosti, k leasingu povinné zmluvné. Klient to čaká —
   a keď mu to nepovieš ty, povie mu to niekto v banke. */
const VIAZANE={

         {id:"nehnut", sila:.95, d:"Nehnuteľnosť, na ktorej je záložné právo, musí byť poistená."}],
 uver:  [{id:"zp",     sila:.85, d:"Úver bez krytia príjmu zostáva na rodine."},
         {id:"pzp",    sila:.8,  d:"Ak je to leasing na auto, povinné zmluvné treba tak či tak."},
         {id:"havko",  sila:.7,  d:"Pri leasingu býva havarijné podmienkou."}],
 pzp:   [{id:"havko",  sila:.85, d:"K povinnému sa havarijné dopĺňa najčastejšie."}],
 zp:    [{id:"dds",    sila:.6,  d:"Keď je vyriešená ochrana, prichádza na rad dôchodok."}],
 fondy: [{id:"dds",    sila:.65, d:"Štátny príspevok pri dôchodkovom sporení sa nechá len tak ležať."}],
 dds:   [{id:"fondy",  sila:.55, d:"Dôchodkové sporenie má strop. Zvyšok patrí inam."}],
 nehnut:[{id:"zp",     sila:.7,  d:"Byt je poistený. Človek, ktorý ho spláca, ešte nie."}],
 havko: [{id:"pzp",    sila:.9,  d:"Havarijné bez povinného zmluvného nedáva zmysel."}]
};
/* Ponuka ďalšej zmluvy — logická nadväznosť je oveľa ľahšia než dopredaj naslepo. */
function moznostiDopredaja(k,podpisane){
 const uz=podpisane.map(z=>z.prodId);
 const zdroj=uz[uz.length-1];
 const zoz=[];
 (VIAZANE[zdroj]||[]).forEach(v=>{
  if(uz.indexOf(v.id)>=0)return;
  const p=PRODUCTS.find(x=>x.id===v.id); if(!p||A("odb")<p.minOdb)return;
  zoz.push({p, sila:v.sila, d:v.d, viazany:true});
 });
 PRODUCTS.forEach(p=>{
  if(uz.indexOf(p.id)>=0||zoz.some(z=>z.p.id===p.id))return;
  if(A("odb")<p.minOdb)return;
  zoz.push({p, sila:.28, d:"S tým, čo ste práve podpísali, to nesúvisí.", viazany:false});
 });
 return zoz;
}

/* ===================== UKLADANIE =====================
   Hra beží na dvoch miestach a každé ponúka iné úložisko:
     · v prostredí Claude je k dispozícii window.storage
     · na bežnej webovej stránke localStorage prehliadača
   Skúšame ich v tomto poradí a pamäť je až posledná záchrana pre prípad,
   že prehliadač úložisko zakázal (anonymné okno, prísne nastavenia).

const MEM={};

function maStorage(){

   typeof window.storage.set==="function" }catch(e){ return false }

}

async function stSet(k,v){
 if(STORAGE_JE){
  try{ const r=await window.storage.set(k,v); if(r)return r }catch(e){}
 }
 if(LOCAL_JE){
  try{ localStorage.setItem(k,v); return {key:k} }catch(e){}
 }
 STORAGE_OK=false; MEM[k]=v; return null;
}
async function stGet(k){
 if(STORAGE_JE){
  try{ const r=await window.storage.get(k); if(r&&r.value!==undefined)return r.value }catch(e){}
 }
 if(LOCAL_JE){
  try{ const v=localStorage.getItem(k); if(v!==null&&v!==undefined)return v }catch(e){}
 }
 return MEM[k]!==undefined?MEM[k]:null;
}
async function stDel(k){
 if(STORAGE_JE){try{ await window.storage.delete(k) }catch(e){}}
 if(LOCAL_JE){try{ localStorage.removeItem(k) }catch(e){}}
 delete MEM[k];
}

/* ===================== PRENOS POZÍCIE MEDZI ZARIADENIAMI =====================
   window.storage je viazané na zariadenie a účet. Aby sa dala pozícia poslať
   správou alebo otvoriť inde, robíme z nej textový kód: JSON → UTF-8 → LZW → base64. */
const KOD_HLAVICKA="PROVIZIA1:";

function lzwKomprimuj(s){
 const slovnik=new Map(); let dalsi=256, w="", out=[];
 for(let i=0;i<256;i++)slovnik.set(String.fromCharCode(i),i);
 for(let i=0;i<s.length;i++){
  const c=s[i], wc=w+c;
  if(slovnik.has(wc)){w=wc;continue}
  out.push(slovnik.get(w));
  if(dalsi<65536)slovnik.set(wc,dalsi++);
  else{slovnik.clear();for(let j=0;j<256;j++)slovnik.set(String.fromCharCode(j),j);dalsi=256}
  w=c;
 }
 if(w!=="")out.push(slovnik.get(w));
 return out;
}
function lzwRozbal(kody){
 let slovnik=[], dalsi=256;
 for(let i=0;i<256;i++)slovnik[i]=String.fromCharCode(i);
 let w=slovnik[kody[0]], out=w;
 for(let i=1;i<kody.length;i++){
  const k=kody[i];
  let zaznam;
  if(k<slovnik.length&&slovnik[k]!==undefined)zaznam=slovnik[k];
  else if(k===dalsi)zaznam=w+w[0];
  else throw new Error("poškodený kód");
  out+=zaznam;
  if(dalsi<65536)slovnik[dalsi++]=w+zaznam[0];
  else{slovnik=[];for(let j=0;j<256;j++)slovnik[j]=String.fromCharCode(j);dalsi=256}
  w=zaznam;
 }
 return out;

const PRENOS_HLAVICKA="PROVIZIA";

/* ---------- LZW s premenlivou šírkou kódu ----------
   Kód začína na 9 bitoch a rastie až pri zaplnení slovníka — oproti pevným
   16 bitom to ušetrí zhruba tretinu dĺžky. */
function lzwZabal(bajty){
 const slovnik=new Map(); let dalsi=256, sirka=9;
 for(let i=0;i<256;i++)slovnik.set(String.fromCharCode(i),i);
 const out=[]; let acc=0, bitov=0;
 const zapis=(k,s)=>{acc=(acc*Math.pow(2,s))+k; bitov+=s;
  while(bitov>=8){bitov-=8; const d=Math.pow(2,bitov); out.push(Math.floor(acc/d)&255); acc=acc%d}};
 let w="";
 for(let i=0;i<bajty.length;i++){
  const c=String.fromCharCode(bajty[i]), wc=w+c;
  if(slovnik.has(wc)){w=wc;continue}
  zapis(slovnik.get(w),sirka);
  if(dalsi<65536){slovnik.set(wc,dalsi++); if(dalsi>(Math.pow(2,sirka)-1)&&sirka<16)sirka++}
  w=c;
 }
 if(w!=="")zapis(slovnik.get(w),sirka);
 if(bitov>0)out.push((acc*Math.pow(2,8-bitov))&255);
 return out;                                  /* pole bajtov */
}
function lzwRozbal(bajty){
 const slovnik=[]; let dalsi=256, sirka=9;
 for(let i=0;i<256;i++)slovnik[i]=String.fromCharCode(i);
 let poz=0, acc=0, bitov=0;
 const citaj=s=>{
  while(bitov<s){ if(poz>=bajty.length)return -1; acc=acc*256+bajty[poz++]; bitov+=8 }
  bitov-=s; const d=Math.pow(2,bitov); const v=Math.floor(acc/d); acc=acc%d; return v;
 };
 const prvy=citaj(sirka); if(prvy<0)throw new Error("prázdne dáta");
 let w=slovnik[prvy]; const out=[w];
 for(;;){
  const k=citaj(sirka); if(k<0)break;
  let zaznam;
  if(slovnik[k]!==undefined)zaznam=slovnik[k];
  else if(k===dalsi)zaznam=w+w.charAt(0);
  else break;                                  /* koncová výplň bitov */
  out.push(zaznam);
  if(dalsi<65536){slovnik[dalsi++]=w+zaznam.charAt(0);
   if(dalsi+1>(Math.pow(2,sirka)-1)&&sirka<16)sirka++}
  w=zaznam;
 }
 const s=out.join(""); const b=new Uint8Array(s.length);
 for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i)&255;
 return b;
}

}

 const s=typeof atob==="function"?atob(t):Buffer.from(t,"base64").toString("binary");

function importKod(text){
 if(!text)throw new Error("Prázdny kód.");
 /* kód sa vyberie aj z bežnej správy — okolitý text a zlomy riadkov nevadia */
 const t=String(text).replace(/\s+/g,"");

 if(!m)throw new Error(t.indexOf(PRENOS_HLAVICKA)>=0
   ? "Kód je neúplný — pravdepodobne sa skrátil pri kopírovaní."
   : "Toto nevyzerá ako prenosový kód hry Provízia.");
 const verziaKodu=m[1];
 let telo=m[2];
 while(telo.length%4)telo=telo.slice(0,-1);
 if(telo.length<16)throw new Error("Kód je neúplný — pravdepodobne sa skrátil pri kopírovaní.");
 let data;
 try{ data=JSON.parse(rozhustiText(zBajtov(lzwRozbal(textNaBajty(telo))))) }
 catch(e){ throw new Error("Kód je poškodený alebo neúplný. Skopíruj ho, prosím, celý.") }
 if(!data||data.h!==PRENOS_HLAVICKA||!data.S)throw new Error("Kód nepatrí tejto hre.");
 return {stav:data.S, hra:data.hra||verziaKodu, build:data.build||"", kedy:data.kedy};
}

/* ---------- porovnanie verzií ----------
   Prenosový kód nesie uloženú hru, nie samotný súbor hry. Nesie však údaj,
   v akom zostavení vznikol — a to stačí na to, aby hra povedala, či ten,
   kto ho načítava, beží na starom súbore. */
function cisloVerzie(v){
 return String(v||"").split(".").map(function(x){return parseInt(x,10)||0});
}
function porovnajVerzie(a,b){
 const x=cisloVerzie(a), y=cisloVerzie(b);
 for(let i=0;i<Math.max(x.length,y.length);i++){
  const p=x[i]||0, q=y[i]||0;
  if(p!==q)return p>q?1:-1;
 }
 return 0;
}
function datumZostavenia(b){
 const m=String(b||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
 return m?m[1]+m[2]+m[3]:null;
}
/* -1 = kód je starší, 0 = zhoda, 1 = kód je novší než bežiaci súbor */
function porovnajZostavenie(hra,build){
 const v=porovnajVerzie(hra,HRA);
 if(v!==0)return v;
 if(build===BUILD)return 0;
 const a=datumZostavenia(build), b=datumZostavenia(BUILD);
 if(a&&b&&a!==b)return a>b?1:-1;
 return build?2:0;                    /* 2 = tá istá verzia, iné zostavenie */
}

  const zaklad=c.replace(/-/g,"+").replace(/_/g,"/");
  const surove=(typeof atob==="function")?atob(zaklad)

const majetokPolozka=id=>MAJETOK.find(m=>m.id===id);
const vKategorii=kat=>MAJETOK.filter(m=>m.kat===kat);

/* ---------- čo hráč práve má ---------- */
function majetokStav(){
 if(!S.majetok||typeof S.majetok!=="object")
  S.majetok={oblecenie:"o_ziadne", auto:"a_ziadne", byvanie:"b_rodicia", kurzy:[]};
 if(!Array.isArray(S.majetok.kurzy))S.majetok.kurzy=[];
 ["oblecenie","auto","byvanie"].forEach(function(k){
  if(!majetokPolozka(S.majetok[k]))S.majetok[k]={oblecenie:"o_ziadne",auto:"a_ziadne",
    byvanie:"b_rodicia"}[k];
 });
 return S.majetok;
}
function maPolozku(id){
 const m=majetokStav();
 return m.oblecenie===id||m.auto===id||m.byvanie===id||m.kurzy.indexOf(id)>=0;
}
/* Súčet bodov k jednému atribútu zo všetkého, čo hráč má. */
function majetokBonus(atr){
 const m=majetokStav();
 let s=0;
 [m.oblecenie,m.auto,m.byvanie].concat(m.kurzy).forEach(function(id){
  const p=majetokPolozka(id); if(!p)return;
  s+=(p.plus&&p.plus[atr])||0;
  s-=(p.minus&&p.minus[atr])||0;
 });
 return s;
}
/* Mesačné náklady na to, čo hráč vlastní. */
function majetokMesacne(){
 const m=majetokStav();
 let s=0;
 [m.oblecenie,m.auto,m.byvanie].concat(m.kurzy).forEach(function(id){
  const p=majetokPolozka(id); if(p)s+=p.mes||0;
 });
 return s;
}
function kupMajetok(id){
 const p=majetokPolozka(id);
 if(!p)return {ok:false,t:"Taká položka neexistuje."};
 if(maPolozku(id))return {ok:false,t:"Toto už máš."};
 if(S.money<p.cena)return {ok:false,t:"Na to nemáš."};
 const m=majetokStav();
 zaplat(p.cena);
 if(p.kat==="kurzy"){ m.kurzy.push(id) }
 else { m[p.kat]=id }
 S.maxE=maxEnergia();
 logg(p.cena?`Kúpené: ${p.nm} za ${p.cena} €.`:`Zmena: ${p.nm}.`,"money-t");
 return {ok:true,t:p.cena?`Kúpené za ${p.cena} €.`:"Zmenené."};
}
/* Krátke zhrnutie účinku — do zoznamu aj do nápovedy. */
function popisUcinku(p){
 const von=[];
 Object.keys(p.plus||{}).forEach(function(k){von.push("+"+p.plus[k]+" "+nazovAtrib(k))});
 Object.keys(p.minus||{}).forEach(function(k){von.push("−"+p.minus[k]+" "+nazovAtrib(k))});
 return von.join(" · ")||"bez vplyvu na atribúty";
}
function nazovAtrib(k){
 const n=(typeof ATTRS!=="undefined")&&ATTRS.find(function(a){return a[0]===k});
 return n?n[1]:k;
}

function bodyRuky(r){

 r.forEach(k=>{ if(k.h==="A"){as++;s+=11} else if(["J","Q","K"].indexOf(k.h)>=0)s+=10; else s+=k.v });
 while(s>21&&as>0){s-=10;as--}
 return s;
}

 else if(bj(KAS.krupier)&&!bj(KAS.hrac)){z=-KAS.stavka;t="Krupiér má blackjack."}

/* Výplatná tabuľka je vypísaná v hre — hráč vie, za čo hrá. */
const POKER_TAB=[
 {nm:"Royal flush",x:250},{nm:"Postupka vo farbe",x:50},{nm:"Štyri rovnaké",x:25},
 {nm:"Full house",x:9},{nm:"Farba",x:6},{nm:"Postupka",x:4},

function vyhodnotPoker(k){
 const poc={}, far={};
 k.forEach(c=>{poc[c.h]=(poc[c.h]||0)+1; far[c.f]=(far[c.f]||0)+1});
 const pocty=Object.values(poc).sort((a,b)=>b-a);
 const farba=Object.values(far).some(n=>n===5);
 const v=k.map(c=>c.v).sort((a,b)=>a-b);
 let postup=v.every((x,i)=>i===0||x===v[i-1]+1);
 if(!postup&&v.join()==="2,3,4,5,14")postup=true;           /* eso ako jednotka */
 const royal=postup&&farba&&v[0]===10;
 const vysoke=Object.keys(poc).filter(h=>poc[h]===2&&["J","Q","K","A"].indexOf(h)>=0).length;
 if(royal)return POKER_TAB[0];
 if(postup&&farba)return POKER_TAB[1];
 if(pocty[0]===4)return POKER_TAB[2];
 if(pocty[0]===3&&pocty[1]===2)return POKER_TAB[3];
 if(farba)return POKER_TAB[4];
 if(postup)return POKER_TAB[5];
 if(pocty[0]===3)return POKER_TAB[6];
 if(pocty[0]===2&&pocty[1]===2)return POKER_TAB[7];
 if(vysoke)return POKER_TAB[8];
 return null;
}
function pokerRozdaj(stavka){

/* ===================== STÁVKY A KRYPTOMENY =====================
   Kurzová stávka aj krypto sú v hre z toho istého dôvodu ako kasíno: sú to
   spôsoby, ako z nepravidelného príjmu urobiť ešte nepravidelnejší.
   Kurzy majú maržu, krypto má poplatok a klesajúci trend — dlhodobo sa
   na tom nedá zarábať, aj keď jednotlivé dni vyzerajú inak.               */

/* ---------- futbal ---------- */
const TIMY=["Nitra","Trnava","Žilina","Košice","Ružomberok","Michalovce","Skalica",
 "Podbrezová","Trenčín","Dunajská Streda","Bratislava","Prešov","Zvolen","Poprad"];
const MARZA=1.08;                    /* kurzová marža stávkovej kancelárie */

function absFaza(){ return (((S.mesiac-1)*DNI)+S.den)*3+S.faza }
function kurz(p){ return Math.max(1.05,Math.round((1/(p*MARZA))*100)/100) }

function losujVysledok(z){
 const r=Math.random();
 if(r<z.p1)return "1";
 if(r<z.p1+z.px)return "x";
 return "2";
}
function generujZapasy(){
 const mix=TIMY.slice().sort(function(){return Math.random()-.5});
 const z=[];
 for(let i=0;i<5;i++){
  const dom=mix[i*2], host=mix[i*2+1];
  /* skryté pravdepodobnosti — kurzy z nich vychádzajú, ale s maržou */
  let p1=.28+Math.random()*.34;
  let px=.20+Math.random()*.12;
  let p2=Math.max(.08,1-p1-px);
  const s=p1+px+p2; p1/=s; px/=s; p2/=s;
  const m={id:i,dom:dom,host:host,p1:p1,px:px,p2:p2,
   k1:kurz(p1),kx:kurz(px),k2:kurz(p2)};
  /* Ako zápas dopadne, sa rozhodne teraz — raz pre všetkých.
     Hráč to nevidí, ale nech stavia ktokoľvek a koľkokrát chce,
     výsledok toho istého zápasu je vždy ten istý. */
  m.vysledok=losujVysledok(m);
  z.push(m);
 }
 return z;
}
/* Ponuka zápasov patrí konkrétnej fáze dňa. Výsledky prídu v ďalšej fáze
   a vtedy sa vypíše nová ponuka — tak ako sa hrá nové kolo. */
function klucZapasov(){ return S.mesiac+"/"+S.den+"/"+S.faza }
function zapasy(){
 if(!Array.isArray(S.zapasy)||!S.zapasy.length||S.zapasyDen!==klucZapasov()){
  S.zapasy=generujZapasy(); S.zapasyDen=klucZapasov();
 }
 return S.zapasy;
}
const NAZOV_TIPU={"1":"domáci","x":"remíza","2":"hostia"};
function kurzTipu(z,tip){ return tip==="1"?z.k1:(tip==="x"?z.kx:z.k2) }

/* Losovanie výsledku podľa skrytých pravdepodobností — nie podľa kurzu. */
function podajTiket(vyber,stavka){
 if(!vyber||!vyber.length||S.money<stavka)return false;
 const celkovyKurz=Math.round(vyber.reduce(function(a,v){return a*v.kurz},1)*100)/100;
 zaplat(stavka);
 S.tikety=S.tikety||[];
 S.tikety.push({vyber:vyber.map(function(v){return {dom:v.dom,host:v.host,tip:v.tip,kurz:v.kurz}}),
  stavka:stavka, kurz:celkovyKurz, splatnost:absFaza()+1,
  podane:{m:S.mesiac,d:S.den,f:S.faza},
  vysl:vyber.map(function(v){return v.z.vysledok}), stav:"otvorený"});
 S.stavkySum=S.stavkySum||{tiketov:0,vyhier:0,vsadene:0,vyhrane:0};
 S.stavkySum.tiketov++; S.stavkySum.vsadene+=stavka;
 pridajGambu(1.4);
 return true;
}
/* Vyhodnotenie sa deje pri prechode do ďalšej fázy. */
/* posun=1 sa používa pri prechode do ďalšej fázy — vtedy sa vyhodnocuje
   ešte pred tým, než sa fáza naozaj prepne. */
function vyhodnotTikety(posun){
 if(!Array.isArray(S.tikety)||!S.tikety.length)return [];
 const teraz=absFaza()+(posun||0), sprava=[];
 S.tikety.forEach(function(t){
  if(t.stav!=="otvorený"||t.splatnost>teraz)return;
  const vsetky=t.vyber.every(function(v,i){return t.vysl[i]===v.tip});
  if(vsetky){
   const vyhra=Math.round(t.stavka*t.kurz);
   S.money+=vyhra; S.kasBilancia=(S.kasBilancia||0)+(vyhra-t.stavka);
   pridajPohodu(Math.min(6,1+vyhra/90)); pridajStres(-1.2);
   t.stav="výhra"; t.vyhra=vyhra; t.kedy={m:S.mesiac,d:S.den,f:S.faza};
   S.stavkySum=S.stavkySum||{tiketov:0,vyhier:0,vsadene:0,vyhrane:0};
   S.stavkySum.vyhier++; S.stavkySum.vyhrane+=vyhra;
   sprava.push({ok:true,t:`Tiket vyšiel — <b class="money-t">+${vyhra} €</b> (kurz ${t.kurz.toFixed(2)}).`});
  } else {
   S.kasBilancia=(S.kasBilancia||0)-t.stavka;
   pridajStres(Math.min(7,1.2+t.stavka/30)); pridajPohodu(-Math.min(5,1+t.stavka/60));
   t.stav="prehra"; t.vyhra=0; t.kedy={m:S.mesiac,d:S.den,f:S.faza};
   const padlo=t.vyber.map(function(v,i){return t.vysl[i]===v.tip?"✓":"✗"}).join("");
   sprava.push({ok:false,t:`Tiket neprešiel (${padlo}). <b class="red">−${t.stavka} €</b>`});
  }
 });
 S.tikety=S.tikety.filter(function(t){return t.stav==="otvorený"}).concat(
   S.tikety.filter(function(t){return t.stav!=="otvorený"}).slice(-14));
 return sprava;
}
const otvoreneTikety=function(){return (S.tikety||[]).filter(function(t){return t.stav==="otvorený"})};
/* najnovšie vyhodnotené tikety navrchu */
const historiaTiketov=function(){
 return (S.tikety||[]).filter(function(t){return t.stav!=="otvorený"}).slice().reverse();
};
const bilanciaStavok=function(){
 const s=S.stavkySum||{tiketov:0,vyhier:0,vsadene:0,vyhrane:0};
 return {tiketov:s.tiketov,vyhier:s.vyhier,vsadene:s.vsadene,vyhrane:s.vyhrane,
   zisk:s.vyhrane-s.vsadene,
   uspesnost:s.tiketov?Math.round(100*s.vyhier/s.tiketov):0};
};

/* ---------- kryptomeny ---------- */
const MENY=[
 {id:"btk",nm:"Bitkoin",zn:"BTK",zaklad:24800,vol:.012,drift:-.0004},
 {id:"etr",nm:"Éter",   zn:"ETR",zaklad:1420, vol:.018,drift:-.0005},
 {id:"slk",nm:"Slovcoin",zn:"SLK",zaklad:0.42,vol:.055,drift:-.0018}];
const POPLATOK=0.012;                 /* poplatok pri nákupe aj predaji */

function kryptoStav(){
 if(!S.kripto||typeof S.kripto!=="object")S.kripto={ceny:{},drzba:{},hist:{},krok:0};
 MENY.forEach(function(m){
  if(!isFinite(S.kripto.ceny[m.id]))S.kripto.ceny[m.id]=m.zaklad;
  if(!S.kripto.drzba[m.id])S.kripto.drzba[m.id]={ks:0,vlozene:0};
  if(!Array.isArray(S.kripto.hist[m.id]))S.kripto.hist[m.id]=[S.kripto.ceny[m.id]];
 });
 return S.kripto;
}
/* Náhodná prechádzka s miernym klesajúcim sklonom. */
function posunKurzy(krokov){
 const k=kryptoStav();
 for(let i=0;i<Math.min(krokov,200);i++){
  MENY.forEach(function(m){
   const sok=(Math.random()*2-1)*m.vol;
   let c=k.ceny[m.id]*(1+m.drift+sok);
   c=Math.max(m.zaklad*.15,Math.min(m.zaklad*6,c));
   k.ceny[m.id]=c;
   const h=k.hist[m.id]; h.push(c); if(h.length>40)h.shift();
  });
  k.krok++;
 }
 return k;
}
function zmenaKurzu(id){
 const k=kryptoStav(), h=k.hist[id];
 if(!h||h.length<2)return 0;
 const p=h[h.length-2];
 return p?((h[h.length-1]-p)/p)*100:0;
}
function zmenaOdZaciatku(id){
 const k=kryptoStav(), h=k.hist[id];
 if(!h||h.length<2)return 0;
 return ((h[h.length-1]-h[0])/h[0])*100;
}
function kupKrypto(id,eur){
 const k=kryptoStav(), m=MENY.find(function(x){return x.id===id});
 if(!m||S.money<eur||eur<=0)return false;
 zaplat(eur);
 const ks=(eur*(1-POPLATOK))/k.ceny[id];
 k.drzba[id].ks+=ks; k.drzba[id].vlozene+=eur;
 pridajGambu(1.1);
 return true;
}
function predajKrypto(id){
 const k=kryptoStav(), d=k.drzba[id];
 if(!d||d.ks<=0)return null;
 const hrubo=d.ks*k.ceny[id];
 const cisto=Math.round(hrubo*(1-POPLATOK));
 const zisk=cisto-Math.round(d.vlozene);
 S.money+=cisto; S.kasBilancia=(S.kasBilancia||0)+zisk;
 if(zisk>0){pridajPohodu(Math.min(5,1+zisk/120));pridajStres(-1)}
 else if(zisk<0){pridajStres(Math.min(6,1+(-zisk)/60));pridajPohodu(-Math.min(4,1+(-zisk)/90))}
 d.ks=0; d.vlozene=0;
 pridajGambu(.8);
 return {cisto:cisto,zisk:zisk};
}
const hodnotaPortfolia=function(){
 const k=kryptoStav(); let s=0;
 MENY.forEach(function(m){s+=k.drzba[m.id].ks*k.ceny[m.id]});
 return s;
};

 }else{

 if(cfg.kravata)px(c,7,14,2,2,"#8b2f2f");

function vekMod(){const v=2026-S.rok;
 if(v<25)return{vyt:1,dov:-1,t:"19–24 rokov: +1 Vytrvalosť, −1 Dôveryhodnosť"};
 if(v<35)return{t:"25–34 rokov: bez modifikátora"};
 if(v<45)return{dov:1,vyt:-1,t:"35–44 rokov: +1 Dôveryhodnosť, −1 Vytrvalosť"};
 return{dov:2,vyt:-2,t:"45+ rokov: +2 Dôveryhodnosť, −2 Vytrvalosť, vyššie výdavky"}}
function scrAttr(){
 const used=Object.values(S.spend).reduce((a,b)=>a+b,0), left=5-used, vm=vekMod();
 app.innerHTML=`<div class="panel"><h1>Vstupný dotazník</h1>
 <p class="dim" style="font-size:11px;margin:4px 0 8px">V čom ste podľa seba lepší než ostatní? Rozdeľte <b class="money-t">${left}</b> ${left==1?"bod":"body"}. Do jednej položky najviac <b>+2</b>.</p>
 <div class="panel2" style="font-size:11px"><span class="gold">Vek:</span> ${vm.t}</div>
 ${ATTRS.map(([k,nm])=>{const v=1+(vm[k]||0)+S.spend[k];return `
 <div class="attr" data-tip="${nm}¶${POPIS_ATRIB[k]}"><span class="nm">${nm} ${tipZnak}</span><span class="bar"><i style="width:${v*10}%"></i></span>
 <span class="vl">${v}/10</span>
 <button class="btn-sm mini" ${S.spend[k]<=0?"disabled":""} onclick="S.spend.${k}--;sClick();render()">−</button>
 <button class="btn-sm mini" ${(left<=0||S.spend[k]>=2)?"disabled":""} onclick="S.spend.${k}++;sClick();render()">+</button></div>`}).join("")}
 <p class="dim mala">Podrž prst na atribúte (alebo naň ukáž myšou) a hra ti povie, na čo je.</p>
 <button class="btn-go" ${left>0?"disabled":""} onclick="startGame()">${left>0?`Zostáva rozdeliť ${left}`:"Nastúpiť do práce →"}</button></div>`;
}
function startGame(){const vm=vekMod();
 S.partnerMeno=S.pohl==="m"?rnd(MZ):rnd(MM);
 ATTRS.forEach(([k])=>S.attrs[k]=Math.max(0,1+(vm[k]||0)+S.spend[k]));
 S.maxE=maxEnergia();S.energia=S.maxE;
 logg("Prvý deň. Roman ti podal ruku: „Do roka si tu na aute.“","gold");
 sGood();S.scr="game";autosave();
 if(!S.flags.uvidelNapovedu)napoveda(true); else render();}

 if(S.buff.trpDnes>0)h+=`<div class="panel2" style="font-size:11px"><span class="gold">Dnes:</span> +${S.buff.trpDnes} trpezlivosť na stretnutiach</div>`;

   h+=`<button ${(draho||blok||chyba)?"disabled":""} onclick="vikend('${v.id}')">

 if(S.faza===0){

     onclick="S.view='crm';crmVyber()">📞 Volať do CRM databázy ${tipZnak}</button>`;

 if(S.faza===2){

   h+=`<button ${d?"disabled":E(2)} onclick="wsStart('${w.id}')">🎓 ${w.nm} ${d?'<span class="green">— absolvované</span>':`<span class="dim">— +1 ${ATTRS.find(x=>x[0]===w.attr)[1]} (2 en.)</span>`}</button>`});
  if(S.lvl===1&&S.wsDone.length>0&&!S.examPassed)
   h+=`<button ${E(1)} onclick="examStart()">📋 Skúška NBS<span class="dim"> — 20 otázok, treba 15 (${S.examTries>0?"60 €":"zdarma"})</span></button>`;

 }
 h+=`<button ${E(1)} data-tip="${S.faza===1?"Poobede je čas na klientov. Ak pôjdeš hrať, dohodnuté stretnutia prepadnú.":(S.faza===2?"Večer to nikomu neublíži. Stojí to 1 energiu.":"Ráno namiesto telefonovania — zajtra nebudeš mať kam ísť.")}"
     onclick="S.view='kasino';kasinoVstup()">🎰 Zájsť do kasína ${tipZnak}</button>`;
 h+=`<hr><button class="btn-go" onclick="dalsiaFaza()">${S.faza<2?"Ďalšia fáza →":"Ísť spať →"}</button></div>`;
 h+=postupPanel();
 h+=dennik();
 setBody(h);
}
function vKolegovia(){
 let h=`<div class="panel"><h2>S kým stráviš tú chvíľu?</h2>
  <p class="dim" style="font-size:11px;margin-bottom:6px">Stojí ťa to jednu energiu. Vzťahy sa nebudujú zadarmo.</p>`;
 const dostupni=LUDIA.filter(p=>zna(p.id));
 if(!dostupni.length)h+=`<p class="dim" style="font-size:11px;padding:6px 0">Zatiaľ tu nikoho nepoznáš natoľko, aby si s ním sadol.</p>`;
 dostupni.filter(p=>p.id!=="partner").forEach(p=>{const v=vz(p.id),[c,t]=stavVztahu(v);
  const ur=urovenCloveka(p.id);
  h+=`<button onclick="posedenie('${p.id}')">${p.ikona} ${menoCloveka(p.id)}
   <span class="dim">· ${p.typ}</span>${ur?` <span class="beige" style="font-size:11px">úr. ${ur} ${LVL_SKRATKA[ur]||""}</span>`:""}
   <span class="${c}" style="font-size:11px">· ${t}</span></button>`});
 if(zna("partner"))h+=`<button onclick="posedenie('partner')">❤️ Zavolať domov <span class="dim">· krátko, ale poteší</span></button>`;
 h+=`<button onclick="S.view='akcie';render()">← Späť</button></div>`;
 setBody(h);
}
function posedenie(id){
 if(S.energia<1||!zna(id)){S.view="akcie";render();return}
 S.energia--; S.view="akcie";
 const pridaj=id==="partner"?5:7;
 zmenVztah(id,pridaj); pridajStres(-3); pridajPohodu(2);
 const rep=replikaVztahu(id);
 logg(`${menoCloveka(id)}: „${rep}“`,"gold");
 /* jednorazový darček od Mareka */
 if(id==="marek"&&vz("marek")>=80&&!S.flags.marekTrik){S.flags.marekTrik=true;
  S.attrs.kom=Math.min(10,S.attrs.kom+1);
  logg("Marek ťa naučil trik s tichom po otázke. +1 Komunikácia.","green")}
 app.innerHTML=hud()+`<div class="panel"><h2>${clovek(id).ikona} ${menoCloveka(id)}</h2>
  <p style="font-size:12px;margin:8px 0;font-style:italic">„${rep}“</p>
  <div class="panel2" style="font-size:11px"><span class="green">+${pridaj} vzťah</span> · −3 stres · +2 pohoda</div>
  <button class="btn-go" onclick="render()">Pokračovať →</button></div>`;
 sGood();
}
function vikend(id){
 const v=VIKEND.find(x=>x.id===id); if(!v||S.money<v.cena)return;
 if(v.treba&&!zna(v.treba))return;
 zaplat(v.cena); v.ef(); S.vikendHotovy=true;
 S.maxE=maxEnergia();
 logg(`${v.ikona} ${v.nm}.`,"green");
 app.innerHTML=hud()+`<div class="panel"><h2>${v.ikona} ${v.nm}</h2>
  <div class="panel2" style="font-size:11px">${v.d}</div>
  <div class="panel2" style="font-size:11px">Stres <b class="${stavStresu()[0]}">${Math.round(S.stres)}</b> ·
   Pohoda <b class="${stavPohody()[0]}">${Math.round(S.pohoda)}</b> ·
   Zdravie <b>${Math.round(S.zdravie)}</b></div>
  <button class="btn-go" onclick="render()">Pokračovať →</button></div>`;
 sGood();
}
/* Ukazovateľ postupu na ďalšiu úroveň — platí pre všetky úrovne, nielen pre prvú. */
function postupPanel(){
 const p=podmienkyPostupu();
 if(!p)return `<div class="panel2" style="font-size:11px"><span class="money-t">Si na vrchole. ${LVL_NAME[S.lvl]}.</span></div>`;
 if(S.povysenie){
  const d=dniDoPovysenia();
  return `<div class="panel2" style="font-size:11px;border-color:var(--money)">
   <span class="money-t">Povýšenie v schvaľovaní</span> — úroveň ${S.povysenie.na} (${LVL_NAME[S.povysenie.na]||""})<br>
   Zostáva <b>${d}</b> ${d===1?"deň":"dní"}.
   ${S.povysenie.zdrzanie?'<br><span class="dim">Roman s tým papierom nikam neponáhľa.</span>':""}</div>`;
 }
 let h=`<div class="panel2" style="font-size:11px">
  <span class="gold">Na úroveň ${p.na} — ${LVL_NAME[p.na]||""}</span>`;
 p.polozky.forEach(x=>{
  if(x.ano!==undefined){
   h+=`<div style="margin-top:5px">${x.nm}: <b class="${x.ano?"green":"red"}">${x.text}</b></div>`;
   return}
  const pct=Math.max(0,Math.min(100,100*x.teraz/x.ciel));
  const hotovo=x.teraz>=x.ciel;
  h+=`<div style="margin-top:5px">${x.nm}:
    <b class="${hotovo?"green":""}">${x.teraz}</b><span class="dim"> / ${x.ciel}${x.jednotka?" "+x.jednotka:""}</span>
    ${hotovo?'<span class="green"> ✓</span>':`<span class="dim"> · chýba ${x.ciel-x.teraz}</span>`}
    <span class="bar" style="margin-top:3px"><i class="${hotovo?"greenb":"goldb"}" style="width:${pct}%"></i></span></div>`});
 const ck=cakanieNaUroven(p.na);
 h+=`<div style="margin-top:6px" class="dim">Po splnení podmienok trvá schválenie ${ck} ${ck===1?"deň":"dní"}.</div>`;
 h+=`<div style="margin-top:5px"><span class="dim">Odomkne sa:</span><br>${
   odomknutieNaUrovni(p.na).map(z=>"· "+z).join("<br>")}</div>`;
 if(S.lvl===1)h+=`<div style="margin-top:5px" class="dim">Bez skúšky nesmieš uzatvárať zmluvy — podpisuje ich Roman a ty berieš 28 % jednotiek.</div>`;
 return h+`</div>`;
}
/* Krátka orientácia pri prvom spustení — a kedykoľvek z menu. */

  ["Klientov si musíš navolať","Bez ranných telefonátov nemáš poobede kam ísť. Väčšina ľudí ťa odmietne — to je normálne, nie chyba."],

  ["Nevhodný predaj sa vráti","Produkt s najvyššou províziou nie je vždy ten správny. Zmluva, ktorú klient nepotreboval, sa o pár mesiacov zruší a províziu vraciaš."],
  ["Nie si len pracovná sila","Stres, zdravie a vzťahy nájdeš v záložke Ja. Keď ich zanedbáš, prejaví sa to na výsledkoch skôr, než čakáš."]
 ];
 app.innerHTML=`<div class="panel napoveda"><h1>${prve?"Vitaj v prvom dni":"Ako sa to hrá"}</h1>

  ${kroky.map(([n,t],i)=>`<div class="krok"><div class="cislo">${i+1}</div>
   <div class="txt"><b class="beige">${n}</b><br><span class="dim">${t}</span></div></div>`).join("")}
  <div class="karta mala"><span class="dim">Túto stránku si kedykoľvek otvoríš cez Menu.</span></div>
  <button class="btn-go" onclick="render()">${prve?"Poďme na to →":"Späť do hry →"}</button></div>`;
}
/* ---------- kontrola pred posunom času ----------
   Deň sa dá preskočiť omylom jedným klepnutím. Hra preto najprv povie,
   čo v tejto fáze zostalo nevyužité, a nechá hráča rozhodnúť sa vedome. */
function varovaniaFazy(){
 const v=[];
 if(S.dovolenka>0&&!jeVikend(S.den))return v;          /* na dovolenke sa nič nerieši */
 if(vZaskoleni()){
  const kroky=obDnes();
  if(kroky.length)v.push({ik:"🎓",silne:true,
   t:"Nedokončené zaškolenie: "+kroky.map(k=>k.nm).join(", ")+"."});
  return v;
 }
 if(jeVikend(S.den)){
  if(!S.vikendHotovy)v.push({ik:"🗓",silne:true,
   t:"Víkend si nijako nevyužil. Stres ti namiesto poklesu stúpne."});
  return v;
 }
 if(S.faza===0){
  const db=SEGMENTY.filter(s=>segmentOdomknuty(s)&&
    (zasobaSegmentu(s.id)===null||zasobaSegmentu(s.id)>0)).length;
  if(S.crmOdomk&&S.energia>=2&&db&&!S.volalDnes)v.push({ik:"📞",silne:true,
   t:"Dnes si nikam nevolal. Bez telefonátov nebudeš mať poobede kam ísť."});
  if(S.papiere>0&&S.energia>=1)v.push({ik:"🗂",silne:false,
   t:"Čaká "+S.papiere+" nespracovaných zmlúv. Chyby v podkladoch stoja pokutu."});
 }
 if(S.faza===1){
  const ud=dnesneUdalosti();
  if(ud.length&&S.energia>=1){
   const kto=ud.map(function(e){const k=KL(e.kid);return k?celeMeno(k):"?"}).join(", ");
   v.push({ik:"👤",silne:true,
    t:"Máš dnes dohodnuté stretnutie: "+kto+". Ak naň nepôjdeš, bude to brať ako zmeškané."});
  }
 }
 if(S.faza===2){
  if(S.lvl===1&&S.wsDone.length>0&&!S.examPassed&&S.energia>=1)v.push({ik:"📋",silne:true,
   t:"Môžeš ísť na skúšku NBS. Bez nej sa nepohneš na druhú úroveň."});
  const ws=WORKSHOPS.filter(function(w){return S.wsDone.indexOf(w.id)<0}).length;
  if(ws&&S.energia>=2)v.push({ik:"🎓",silne:false,
   t:"Zostáva "+ws+" neabsolvovaných workshopov. Otvárajú otázky do skúšky aj atribúty."});
  if(S.energia>=1&&!v.length)v.push({ik:"🏠",silne:false,
   t:"Zostáva ti energia. Večer doma zníži stres a pridá silu na zajtra."});
 }
 return v;
}
function dalsiaFaza(){
 const v=varovaniaFazy();
 if(!v.length){nextPhase();return}
 const silne=v.filter(function(x){return x.silne}).length;
 const nadpis=jeVikend(S.den)?"ukončiť víkend":(S.faza<2?"prejsť ďalej":"ísť spať");
 let h='<div class="panel"><h2>Naozaj '+nadpis+"?</h2>";
 h+='<p class="podnadpis">'+(silne?"Toto ešte stihneš urobiť:":"Ešte niečo zostalo:")+"</p>";
 v.forEach(function(x){
  h+='<div class="karta '+(x.silne?"zle":"pozor")+' mala">'+x.ik+" "+x.t+"</div>";
 });
 h+='<div class="panel2 mala">Energia: <b>'+S.energia+"/"+S.maxE+"</b>"+
    (S.energia>0?" — nevyužitá energia sa do zajtra neprenáša.":"")+"</div>";
 h+='<hr><button class="btn-go" onclick="S.view=\'akcie\';render()">← Vrátiť sa a dokončiť to</button>';
 h+='<button class="btn-tichy" onclick="nextPhase()">Aj tak pokračovať →</button></div>';
 setBody(h);
}

const KL_FILTRE=[["vsetci","Všetci"],["osloviteľní","Dá sa osloviť"],["klienti","S podpisom"],
 ["rozprac","Rozpracovaní"],["strateni","Stratení"]];
const NA_STRANU=8;
function filterKlientov(){
 const all=Object.values(S.klienti).sort((a,b)=>b.id-a.id);
 switch(S.klFilter){
  case "osloviteľní": return all.filter(k=>mozeZnovu(k)||k.stav==="teply");
  case "klienti":     return all.filter(k=>k.stav==="klient");
  case "rozprac":     return all.filter(k=>k.stav==="lead"||k.stav==="rozprac"||k.stav==="odmietol");
  case "strateni":    return all.filter(k=>k.stav==="stratený");
  default:            return all;
 }
}
function vKlienti(){
 const all=Object.values(S.klienti);
 const zoz=filterKlientov();
 const strany=Math.max(1,Math.ceil(zoz.length/NA_STRANU));
 if(S.klStrana>=strany)S.klStrana=strany-1;
 if(S.klStrana<0)S.klStrana=0;
 const od=S.klStrana*NA_STRANU, cast=zoz.slice(od,od+NA_STRANU);
 const dostupni=all.filter(k=>mozeZnovu(k)||k.stav==="teply").length;
 let h=`${appBar("Klienti","Každý, komu si zavolal alebo s kým si sedel. Nikto sa odtiaľto nestratí.")}<div class="panel">
  <div class="panel2" style="font-size:11px">Spolu <b>${all.length}</b> ·
   s podpisom <b class="green">${all.filter(k=>k.stav==="klient").length}</b> ·
   dá sa osloviť <b class="gold">${dostupni}</b> ·
   stratení <b class="red">${all.filter(k=>k.stav==="stratený").length}</b></div>
  <div class="filtre">${KL_FILTRE.map(([id,nm])=>{
   let n=0;
   const zal=S.klFilter;S.klFilter=id;n=filterKlientov().length;S.klFilter=zal;
   return `<button class="${S.klFilter===id?"on":""}" onclick="S.klFilter='${id}';S.klStrana=0;sClick();render()">${nm} (${n})</button>`}).join("")}</div>`;
 if(!zoz.length)h+=`<p class="dim" style="font-size:11px;padding:6px 0">${all.length?"V tomto filtri nikto nie je.":"Zatiaľ nikoho nepoznáš. Začni telefonovať."}</p>`;
 cast.forEach(k=>{
  const st={lead:["dim","čaká na stretnutie"],rozprac:["gold",rod(k.pohl,"rozpracovaný","rozpracovaná")],
   klient:["green",klientSlovo(k)],teply:["money-t","teplý kontakt"],
   "odmietol":["gold",rod(k.pohl,"odmietol","odmietla")],
   "stratený":["red",rod(k.pohl,"stratený","stratená")]}[k.stav]||["dim",k.stav];
  const ev=S.kalendar.find(e=>e.kid===k.id&&!e.done);
  const moze=mozeZnovu(k)||k.stav==="teply";
  h+=`<button onclick="detail(${k.id})"><b>${osl(k)} ${celeMeno(k)}</b>, ${k.vek} r.
   <span class="dim"> · ${k.mesto}</span><br>
   <span class="${st[0]}" style="font-size:11px">${st[1]}</span>
   <span class="dim" style="font-size:11px">${k.zmluvy.length?" · "+k.zmluvy.length+" zml.":""}${ev?" · termín "+ev.m+"/"+ev.d:""}${moze?' · <span class="money-t">možno volať</span>':""}</span></button>`});
 if(strany>1)h+=`<div class="strany">
   <button class="btn-sm" ${S.klStrana<=0?"disabled":""} onclick="S.klStrana--;sClick();render()">← Späť</button>
   <span>strana ${S.klStrana+1} / ${strany}</span>
   <button class="btn-sm" ${S.klStrana>=strany-1?"disabled":""} onclick="S.klStrana++;sClick();render()">Ďalej →</button></div>`;
 setBody(h+`</div>`);
}
function detail(id){
 const k=KL(id); if(!k)return; opravKlienta(k);
 const p=persona(k);
 const vidi=k.znama.length?faktyKlienta(k).filter((_,i)=>k.znama.includes(i)):[];
 const ev=S.kalendar.find(e=>e.kid===k.id&&!e.done);
 let h=`<div class="panel"><div style="display:flex;gap:10px;align-items:center">
  ${faceHTML("kf",5)}<div style="flex:1"><h2 style="margin:0">${osl(k)} ${celeMeno(k)}</h2>
  <span class="dim" style="font-size:11px">${k.vek} rokov · ${k.mesto}</span><br>
  <span style="font-size:11px">Náročnosť ${"●".repeat(k.nar)}${"○".repeat(5-k.nar)}</span></div></div>
  <div class="panel2" style="font-size:11px"><span class="gold">${p.nm}</span><br>${p.tip}</div>`;
 h+=`<h3>Čo o ňom vieš</h3>`;
 if(!vidi.length)h+=`<p class="dim" style="font-size:11px">Nič. Na stretnutí sa treba pýtať.</p>`;
 else h+=vidi.map(f=>`<div class="panel2" style="font-size:11px">${f.n}: <b>${f.v}</b></div>`).join("");
 if(k.zmluvy.length){h+=`<h3>Zmluvy</h3>`+k.zmluvy.map(z=>
  `<div class="panel2" style="font-size:11px">${z.prod} · <b class="un-t">${z.un} UN</b>
   <span class="dim"> · mesiac ${z.m}</span>${z.fit?'<span class="green"> · vhodné</span>':'<span class="red"> · nevhodné</span>'}
   ${z.serviced?'<span class="green"> · po servise</span>':""}</div>`).join("")}
 if(k.pozn.length)h+=`<h3>Poznámky</h3>`+k.pozn.map(p=>`<div class="panel2" style="font-size:11px">${p}</div>`).join("");
 h+=`<hr>`;
 if(ev)h+=`<div class="panel2" style="font-size:11px">Naplánované na <b>${ev.m}/${ev.d}</b> (${ev.typ})</div>
   <button onclick="zrusTermin(${ev.id})">Zrušiť termín <span class="dim">— klient to neocení</span></button>`;
 else if(k.stav==="klient")h+=`<button onclick="planServis(${k.id})">🔧 Naplánovať servis <span class="dim">— znižuje riziko storna</span></button>`;
 else if(mozeZnovu(k))h+=`<button ${(S.faza===0&&S.energia>=1)?"":"disabled"} onclick="znovuVolat(${k.id})">
   📞 Zavolať znova <span class="dim">— ${S.faza===0?"1 energia · možno sa niečo zmenilo":"len v rannej fáze"}</span></button>`;
 else if(k.stav==="odmietol"||k.stav==="rozprac"){
  const p=k.poslednyPokus||k.odmietnutyDna||{m:S.mesiac,d:S.den};
  const ostava=DNI-(absDen(S.mesiac,S.den)-absDen(p.m,p.d));
  h+=`<div class="panel2" style="font-size:11px"><span class="dim">Znova volať sa dá o ${Math.max(1,ostava)} ${ostava===1?"deň":"dní"}. Príliš skoro pôsobí zúfalo.</span></div>`}
 h+=`<button onclick="S.view='klienti';render()">← Späť na zoznam</button></div>`;
 setBody(h); paintFace("kf",klFace(k),5);
}
function zrusTermin(eid){const e=S.kalendar.find(x=>x.id===eid);if(!e)return;
 const k=KL(e.kid);S.kalendar=S.kalendar.filter(x=>x.id!==eid);
 if(k){k.stav="rozprac";k.dov-=10;k.pozn.push(`Zrušil si termín ${e.m}/${e.d}.`)}
 logg(`Zrušený termín s klientom ${k?celeMeno(k):""}.`,"red");sBad();render()}
function planServis(id){planTermin(id,"servis")}
function planStretnutie(id){planTermin(id,"stretnutie")}
let PLAN=null;
function planTermin(id,typ){PLAN={id,typ};
 const t=ponukaTerminov();
 let h=`<div class="panel"><h2>Kedy?</h2>`;
 if(!t.length)h+=`<p class="red">Najbližšie dni sú plné. Zruš niečo v kalendári.</p>`;
 t.forEach(x=>h+=`<button onclick="potvrdTermin(${x.m},${x.d})">${nazovDna(x.m,x.d)}
   <span class="dim"> — ${x.off===1?"zajtra":"o "+x.off+" dni"} · voľné ${volnoDna(x.m,x.d)}/${KAPACITA}</span></button>`);
 h+=`<button onclick="PLAN=null;render()">← Späť</button></div>`;
 setBody(h);
}
function potvrdTermin(m,d){if(!PLAN)return;const k=KL(PLAN.id);
 pridajTermin(PLAN.id,m,d,PLAN.typ); if(k&&k.stav!=="klient")k.stav="lead";
 logg(`Termín ${PLAN.typ==="servis"?"servisu":"stretnutia"} s ${k?celeMeno(k):""} na ${m}/${d}.`,"green");
 PLAN=null;sGood();S.view="kalendar";render()}

 }

 const bud=S.kalendar.filter(e=>!e.done&&absDen(e.m,e.d)>=absDen(S.mesiac,S.den))
   .sort((a,b)=>absDen(a.m,a.d)-absDen(b.m,b.d));
 h+=`<h3 style="margin-top:8px">Nadchádzajúce</h3>`;

 if(min.length){h+=`<h3 style="margin-top:8px">Vybavené</h3>`+min.map(e=>{const k=KL(e.kid);

 setBody(h+`</div>`);
}

function kup(id){

function kopirujKod(){
 const e=document.getElementById("kodOut"); if(!e)return;
 const hotovo=()=>{const s=document.getElementById("kodStav");
  if(s)s.innerHTML='<span class="green">Kód je v schránke.</span>'};
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){
   navigator.clipboard.writeText(e.value).then(hotovo,vyberKod); return}
 }catch(err){}
 vyberKod();
}
function vyberKod(){
 const e=document.getElementById("kodOut"); if(!e)return;
 try{e.focus();e.select();e.setSelectionRange(0,e.value.length);
  const ok=document.execCommand&&document.execCommand("copy");
  const s=document.getElementById("kodStav");
  if(s)s.innerHTML=ok?'<span class="green">Kód je v schránke.</span>'
   :'<span class="gold">Kód je označený — skopíruj ho podržaním prsta.</span>';
 }catch(err){
  const s=document.getElementById("kodStav");
  if(s)s.innerHTML='<span class="gold">Označ text v poli a skopíruj ho ručne.</span>';
 }
}
function stiahniKod(){
 const e=document.getElementById("kodOut"); if(!e)return;
 const s=document.getElementById("kodStav");
 try{
  const b=new Blob([e.value],{type:"text/plain"});
  const u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download=`provizia-${S.meno||"hra"}-m${S.mesiac}d${S.den}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(u),2000);
  if(s)s.innerHTML='<span class="green">Súbor uložený medzi stiahnuté.</span>';
 }catch(err){
  if(s)s.innerHTML='<span class="gold">Sťahovanie tu nefunguje — použi kopírovanie kódu.</span>';
 }
}

function vlozZoSchranky(){
 const s=document.getElementById("impStav");
 try{
  if(navigator.clipboard&&navigator.clipboard.readText){
   navigator.clipboard.readText().then(t=>{
    const e=document.getElementById("kodIn"); if(e)e.value=t;
    if(s)s.innerHTML='<span class="green">Vložené. Teraz klepni na Načítať hru.</span>';
   },()=>{if(s)s.innerHTML='<span class="gold">Vlož kód do poľa podržaním prsta.</span>'});
   return}
 }catch(err){}
 if(s)s.innerHTML='<span class="gold">Vlož kód do poľa podržaním prsta.</span>';
}
function nacitajSubor(inp){
 const s=document.getElementById("impStav");
 const f=inp&&inp.files&&inp.files[0];
 if(!f){return}
 try{
  const r=new FileReader();
  r.onload=()=>{const e=document.getElementById("kodIn");
   if(e)e.value=String(r.result||"");
   if(s)s.innerHTML='<span class="green">Súbor načítaný. Teraz klepni na Načítať hru.</span>'};
  r.onerror=()=>{if(s)s.innerHTML='<span class="red">Súbor sa nepodarilo prečítať.</span>'};
  r.readAsText(f);
 }catch(err){ if(s)s.innerHTML='<span class="red">Súbor sa nepodarilo prečítať.</span>' }
}

function spravaOZostaveni(v){

/* ---------- odznaky: kde treba pozrieť ---------- */
function odznakApky(id){
 try{
  if(id==="akcie")return {t:S.energia+"/"+S.maxE, farba:S.energia?"":"dim"};
  if(id==="crm"){
   if(jeVikend(S.den)||!S.crmOdomk)return null;
   if(S.faza===0&&!S.volalDnes&&S.energia>=2)return {t:"volať", farba:"cerv"};
   const n=SEGMENTY.filter(s=>segmentOdomknuty(s)&&
     (zasobaSegmentu(s.id)===null||zasobaSegmentu(s.id)>0)).length;
   return n?{t:String(n), farba:"dim"}:null;
  }
  if(id==="kalendar"){
   const d=dnesneUdalosti().length;
   if(d)return {t:String(d), farba:S.faza===1?"cerv":"gold"};
   const b=(S.kalendar||[]).filter(e=>!e.done).length;
   return b?{t:String(b), farba:"dim"}:null;
  }
  if(id==="klienti"){
   const n=Object.keys(S.klienti||{}).length;
   return n?{t:String(n), farba:"dim"}:null;
  }
  if(id==="tabula")return {t:"lvl "+S.lvl, farba:S.povysenie?"gold":"dim"};
  if(id==="potreby"){
   if(S.stres>=65||S.zdravie<40)return {t:"pozor", farba:"cerv"};
   if(S.pohoda<30)return {t:"pozor", farba:"gold"};
   return null;
  }
  if(id==="nakupy"){
   const m=(typeof majetokMesacne==="function")?majetokMesacne():0;
   return m?{t:m+" €", farba:"dim"}:null;
  }
  if(id==="kasino"){
   const t=(typeof otvoreneTikety==="function")?otvoreneTikety().length:0;
   return t?{t:String(t), farba:"gold"}:null;
  }
  if(id==="menu")return null;
 }catch(e){}
 return null;
}

/* ===================== NÁPOVEDA PRI DOTYKU =====================
   Vysvetlivky nemajú zaberať miesto pod každou položkou. Ukážu sa až
   keď na vec ukážeš myšou alebo na nej podržíš prst.                     */

let TIP_PRVOK=null, TIP_CAS=null, TIP_TLM=false;

function tipBublina(){
 let b=document.getElementById("tipbub");
 if(!b){
  b=document.createElement("div");
  b.id="tipbub"; b.className="tip";
  document.body.appendChild(b);
 }
 return b;
}
function tipUkaz(el){
 const t=el&&el.getAttribute&&el.getAttribute("data-tip");
 if(!t)return;
 const b=tipBublina();
 b.textContent=t;                          /* text, nie značky — bezpečne aj v atribúte */
 if(t.indexOf("¶")>=0)b.innerHTML=b.innerHTML.split("¶").join("<br>");
 b.className="tip on";
 try{
  const r=el.getBoundingClientRect();
  const w=Math.min(280,(window.innerWidth||360)-24);
  b.style.maxWidth=w+"px";
  const vys=b.offsetHeight||60;
  let top=r.top-vys-10;
  if(top<8)top=r.bottom+10;               /* keď sa hore nezmestí, ide dole */
  let left=r.left+r.width/2-w/2;
  left=Math.max(12,Math.min(left,(window.innerWidth||360)-w-12));
  b.style.top=top+"px"; b.style.left=left+"px";
 }catch(e){}
 TIP_PRVOK=el;
}
function tipSkry(){
 const b=document.getElementById("tipbub");
 if(b)b.className="tip";
 TIP_PRVOK=null;
 if(TIP_CAS){clearTimeout(TIP_CAS);TIP_CAS=null}
}
function tipZapoj(){
 if(typeof document==="undefined"||!document.addEventListener)return;
 if(window.__tipZapojene)return;
 window.__tipZapojene=true;
 const najdi=e=>{
  const c=e.target&&e.target.closest?e.target.closest("[data-tip]"):null;
  return c;
 };
 /* myš: stačí ukázať */
 document.addEventListener("mouseover",function(e){
  const el=najdi(e); if(el&&el!==TIP_PRVOK)tipUkaz(el);
 });
 document.addEventListener("mouseout",function(e){
  const el=najdi(e); if(el&&el===TIP_PRVOK)tipSkry();
 });
 /* dotyk: podržať prst */
 document.addEventListener("touchstart",function(e){
  const el=najdi(e); if(!el)return;
  TIP_TLM=false;
  if(TIP_CAS)clearTimeout(TIP_CAS);
  TIP_CAS=setTimeout(function(){
   TIP_TLM=true;                          /* po zobrazení nápovedy sa nemá spustiť akcia */
   tipUkaz(el);
   if(navigator.vibrate)try{navigator.vibrate(8)}catch(x){}
  },420);
 },{passive:true});
 ["touchend","touchmove","touchcancel","scroll"].forEach(function(u){
  document.addEventListener(u,function(){
   if(TIP_CAS){clearTimeout(TIP_CAS);TIP_CAS=null}
   if(u!=="touchmove"&&u!=="scroll")setTimeout(tipSkry,1800); else tipSkry();
  },{passive:true});
 });
 /* dlhé podržanie nesmie zároveň stlačiť tlačidlo */
 document.addEventListener("click",function(e){
  if(TIP_TLM){TIP_TLM=false;e.stopPropagation();e.preventDefault();tipSkry();return}
  tipSkry();
 },true);
}

/* ---------- kryptomeny ---------- */
let KRYPTO_TIK=null;
function kryptoOtvor(){
 kryptoStav();
 /* kurzy sa hýbu aj vtedy, keď sa hráč nepozerá */
 const teraz=Date.now();
 if(S.kripto.cas){
  const krokov=Math.floor((teraz-S.kripto.cas)/10000);
  if(krokov>0)posunKurzy(krokov);
 }
 S.kripto.cas=teraz;
 KAS={hra:"krypto",suma:50};
 kryptoTikStart();
 kasDraw();
}
function kryptoTikStart(){
 kryptoTikStop();
 if(typeof setInterval!=="function")return;
 KRYPTO_TIK=setInterval(function(){
  if(!KAS||KAS.hra!=="krypto"){kryptoTikStop();return}
  posunKurzy(1);
  S.kripto.cas=Date.now();
  kasDraw();
 },10000);
}
function kryptoTikStop(){
 if(KRYPTO_TIK&&typeof clearInterval==="function")clearInterval(KRYPTO_TIK);
 KRYPTO_TIK=null;
}
function kryptoSuma(s){ if(KAS)KAS.suma=s; kasDraw() }
function kryptoKup(id){
 if(!KAS)return;
 if(kupKrypto(id,KAS.suma)){KAS.hlaska={ok:true,t:"Nakúpené za "+KAS.suma+" €."};sCash()}
 else {KAS.hlaska={ok:false,t:"Na to nemáš."};sBad()}
 kasDraw();
}
function kryptoPredaj(id){
 const r=predajKrypto(id);
 if(!r){sBad();return}
 KAS.hlaska={ok:r.zisk>=0,t:"Predané za "+r.cisto+" € · "+(r.zisk>=0?"+":"")+r.zisk+" €"};
 r.zisk>=0?sCash():sBad();
 kasDraw();
}
function grafKurzu(id){
 const h=kryptoStav().hist[id]||[];
 if(h.length<2)return "";
 const min=Math.min.apply(null,h), max=Math.max.apply(null,h), r=(max-min)||1;
 const body=h.map(function(c,i){
  const x=(i/(h.length-1))*100, y=32-((c-min)/r)*28-2;
  return x.toFixed(1)+","+y.toFixed(1);
 }).join(" ");
 const stupa=h[h.length-1]>=h[0];
 return '<svg class="graf" viewBox="0 0 100 32" preserveAspectRatio="none">'+
   '<polyline points="'+body+'" fill="none" stroke="'+(stupa?"var(--green)":"var(--red)")+
   '" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>';
}
function vKrypto(){
 const k=kryptoStav();
 let h='<div class="panel"><h2>Kryptomeny</h2>';
 h+='<p class="podnadpis">Kurz sa hýbe každých desať sekúnd — aj keď sa nepozeráš. Poplatok '+
    Math.round(POPLATOK*1000)/10+' % pri nákupe aj predaji.</p>';
 if(KAS.hlaska){
  h+='<div class="karta '+(KAS.hlaska.ok?"dobre":"zle")+' zaver mala">'+KAS.hlaska.t+'</div>';
  KAS.hlaska=null;
 }
 const port=hodnotaPortfolia();
 h+='<div class="panel2 mala">Hotovosť <b class="money-t">'+Math.round(S.money)+' €</b>'+
    (port>0?' · v menách <b class="beige">'+Math.round(port)+' €</b>':"")+'</div>';
 MENY.forEach(function(m){
  const c=k.ceny[m.id], zm=zmenaKurzu(m.id), cel=zmenaOdZaciatku(m.id);
  const d=k.drzba[m.id];
  const far=zm>0.01?"green":(zm<-0.01?"red":"dim");
  const sip=zm>0.01?"▲":(zm<-0.01?"▼":"—");
  h+='<div class="minca"><div class="hlava">'+
     '<span><b>'+m.nm+'</b> <span class="dim mala">'+m.zn+'</span></span>'+
     '<span class="kurz '+far+' tik">'+(c<10?c.toFixed(4):Math.round(c).toLocaleString("sk-SK"))+' €'+
     ' <span class="mala">'+sip+' '+Math.abs(zm).toFixed(2)+' %</span></span></div>';
  h+=grafKurzu(m.id);
  h+='<div class="mala dim">od otvorenia <span class="'+(cel>=0?"green":"red")+'">'+
     (cel>=0?"+":"")+cel.toFixed(1)+' %</span></div>';
  if(d.ks>0){
   const hod=d.ks*c, zisk=Math.round(hod*(1-POPLATOK))-Math.round(d.vlozene);
   h+='<div class="karta '+(zisk>=0?"dobre":"zle")+' mala">Držíš za '+Math.round(d.vlozene)+
      ' € · teraz <b>'+Math.round(hod)+' €</b> · <b class="'+(zisk>=0?"green":"red")+'">'+
      (zisk>=0?"+":"")+zisk+' €</b></div>';
   h+='<button onclick="kryptoPredaj(\''+m.id+'\')">Predať všetko</button>';
  } else {
   h+='<button '+(S.money<KAS.suma?"disabled":"")+' onclick="kryptoKup(\''+m.id+'\')">Kúpiť za '+KAS.suma+' €</button>';
  }
  h+='</div>';
 });
 h+='<h3>Za koľko nakupovať</h3><div class="filtre">';
 [25,50,100,250,500].forEach(function(s){
  h+='<button class="'+(KAS.suma===s?"on":"")+'" '+(S.money<s?"disabled":"")+
     ' onclick="kryptoSuma('+s+')">'+s+' €</button>';
 });
 h+='</div>';
 h+='<hr><button onclick="kryptoTikStop();kasSpat()">← Späť do kasína</button></div>';
 setBody(h);
}
